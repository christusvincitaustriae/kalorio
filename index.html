        return `<div class="burn"><div class="b-ic">${ICON[ex.ic]}</div><div class="grow"><b>${ex.n}</b><div class="xs faint">${sub}</div></div><div class="b-v"><b>${main}</b><div><button class="chip" style="margin-top:4px;padding:3px 9px;font-size:12px" data-did="${ex.id}">Erledigt</button></div></div></div>`;
      }).join("")}</div>
      <button class="btn ghost sm block" data-burnall>${burnAll ? "Weniger anzeigen" : `Alle ${EXERCISES.length} Übungen anzeigen`}</button>
      <p class="xs faint" style="margin-top:8px">Netto-Verbrauch über MET-Werte (zusätzlich zum Ruheumsatz). Kraftübungen verbrennen pro Minute wenig, stärken aber die Muskulatur – für viele Kalorien sind Ausdauerübungen effektiver.</p>
    </section>` : ""}
  </div>`;

  bindToday(v);
}

function bindToday(v) {
  const k = App.date;
  v.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.day) { App.date = daddKey(App.date, +b.dataset.day); render(); return; }
    if (b.hasAttribute("data-scan")) { openScanner(k, guessMeal()); return; }
    if (b.dataset.add) { openAddSheet(k, +b.dataset.add); return; }
    if (b.dataset.entry) { openEntrySheet(k, b.dataset.entry); return; }
    if (b.dataset.copymeal) {
      const mi = +b.dataset.copymeal;
      const y = App.days.get(daddKey(k, -1));
      for (const e2 of y.entries.filter((x) => x.meal === mi)) await addEntry(k, { ...e2, id: uid(), t: Date.now() });
      toast(`${MEALS[mi]} von gestern übernommen`); render(); return;
    }
    if (b.dataset.water != null) {
      const d = getDay(k); const g = App.settings.glass || 250; const i = +b.dataset.water;
      const filled = Math.floor((d.water || 0) / g);
      d.water = filled === i + 1 ? i * g : (i + 1) * g;
      await saveDay(k); render(); return;
    }
    if (b.hasAttribute("data-water-plus")) { const d = getDay(k); d.water = (d.water || 0) + (App.settings.glass || 250); await saveDay(k); render(); return; }
    if (b.hasAttribute("data-addact")) { openActivitySheet(k); return; }
    if (b.dataset.rmact) { const d = getDay(k); d.acts = d.acts.filter((a) => a.id !== b.dataset.rmact); await saveDay(k); render(); return; }
    if (b.hasAttribute("data-burnall")) { burnAll = !burnAll; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (b.dataset.burn) { burnTarget = +b.dataset.burn; burnUser = true; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (b.dataset.did) {
      const ex = EXERCISES.find((x) => x.id === b.dataset.did);
      const r = exercisePlan(ex, burnTarget, latestWeight());
      const d = getDay(k); d.acts = d.acts || [];
      d.acts.push({ id: uid(), label: ex.n, ic: ex.ic, kcal: r.kcal, detail: ex.kind === "reps" ? `${r.sets} × ${r.reps} Wdh.` : `${r.min} Min.` });
      await saveDay(k); toast(`${ex.n} eingetragen: +${fmt(r.kcal)} kcal`); render(); return;
    }
  });
}

/* Eintrag bearbeiten */
function openEntrySheet(k, id) {
  const d = getDay(k);
  const e = d.entries.find((x) => x.id === id);
  if (!e) return;
  if (!e.per) { openQuickEdit(k, e); return; }
  const food = Foods.byId.get(e.fid) || { id: e.fid, n: e.n, b: e.b, u: e.u, ...e.per, po: e.label && e.qty ? [[e.label, e.amount / e.qty]] : [], s: "R" };
  openFoodDetail(food, k, e.meal, e);
}

/* Aktivität eintragen */
function openActivitySheet(k) {
  const kg = latestWeight();
  const body = `<div class="stack s16">
    ${seg("actmode", [["sport", "Sport"], ["steps", "Schritte"], ["kcal", "kcal direkt"]], "sport")}
    <div id="am_sport" class="stack">
      <label class="field"><span>Aktivität</span><select class="input" id="a_type">${SPORTS.map((x) => `<option value="${x.id}">${esc(x.n)}</option>`).join("")}</select></label>
      ${numField("a_min", "Dauer", 30, "Min.")}
    </div>
    <div id="am_steps" class="stack hide">${numField("a_steps", "Zusätzliche Schritte", 3000, "")}<p class="xs faint">Nur Schritte über deinen normalen Alltag hinaus – der steckt schon in deiner Alltagsaktivität.</p></div>
    <div id="am_kcal" class="stack hide">${numField("a_kcal", "Verbrannte kcal (z. B. von der Uhr)", "", "kcal")}<p class="xs faint">Fitness-Tracker überschätzen oft um 20–40 %. Trage lieber den Aktiv-Wert ein, nicht den Gesamtverbrauch.</p></div>
    <div class="tile"><span class="label">Netto-Verbrauch</span><div class="t-v" id="a_out">–</div></div>
  </div>`;
  const s = openSheet({ title: "Aktivität eintragen", body, foot: `<button class="btn primary block" data-save>${ICON.check} Eintragen</button>` });
  let mode = "sport";
  const calc = () => {
    if (mode === "sport") { const sp = sportById($("#a_type").value); const m = readNum("a_min"); return m > 0 ? { kcal: activityKcal(sp.met, m, kg), label: sp.n, ic: sp.ic, detail: `${fmt(m)} Min.` } : null; }
    if (mode === "steps") { const st = readNum("a_steps"); return st > 0 ? { kcal: stepsKcal(st, kg), label: "Zusätzliche Schritte", ic: "walk", detail: `${fmt(st)} Schritte` } : null; }
    const kc = readNum("a_kcal"); return kc > 0 ? { kcal: Math.round(kc), label: "Aktivität", ic: "flame", detail: "manuell" } : null;
  };
  const upd = () => { const r = calc(); $("#a_out", s.el).textContent = r ? `${fmt(r.kcal)} kcal` : "–"; };
  bindSeg(s.el, "actmode", (m) => { mode = m; ["sport", "steps", "kcal"].forEach((x) => $("#am_" + x, s.el).classList.toggle("hide", x !== m)); upd(); });
  s.el.addEventListener("input", upd); s.el.addEventListener("change", upd); upd();
  $("[data-save]", s.el).onclick = async () => {
    const r = calc(); if (!r) { toast("Bitte einen Wert eingeben"); return; }
    const d = getDay(k); d.acts = d.acts || []; d.acts.push({ id: uid(), ...r });
    await saveDay(k); s.close(); toast(`+${fmt(r.kcal)} kcal Aktivität`); render();
  };
}

/* ===== Lebensmittel hinzufügen: Suche, Detail, Schnell-Eintrag, eigene Produkte ===== */
function resultRow(f, extra = "") {
  const dp = defaultPortion(f);
  const kp = f.k * dp.g / 100;
  return `<div class="res" role="button" tabindex="0" data-food="${esc(f.id)}">
    <div class="grow" style="min-width:0">
      <div class="r-n">${esc(f.n)} ${srcBadge(f)}</div>
      <div class="r-b">${f.b ? esc(f.b) + " · " : ""}${esc(dp.label)}${dp.label.includes(String(dp.g)) ? "" : ` (${fmt(dp.g)} ${f.u})`}</div>
    </div>
    <div class="r-k"><b>${fmt(kp)}</b><span>${fmt(f.k)}/100${f.u}</span></div>
    <button class="quick" data-quick="${esc(f.id)}" aria-label="${esc(f.n)} schnell hinzufügen">${ICON.plus}</button>${extra}
  </div>`;
}

function openAddSheet(k, meal) {
  let tab = "recent";
  let q = "";
  let catSel = null;
  const s = openSheet({
    title: `Hinzufügen <span class="faint" style="font-weight:500">· ${dlabel(k)}</span>`, full: true,
    body: `<div class="stack">
      <div class="field">${seg("meal", MEALS.map((m, i) => [i, m.replace("Mittagessen", "Mittag").replace("Abendessen", "Abend").replace("Frühstück", "Früh")]), meal)}</div>
      <div class="search">${ICON.search}<input class="input" id="q" type="search" placeholder="Suchen: z. B. Krapfen, Cola, Schnitzel…" autocomplete="off" enterkeyhint="search"><button class="icon-btn plain clear hide" id="qclear" aria-label="Leeren">${ICON.close}</button></div>
      <div class="grid2" id="actions">
        <button class="btn" data-scan>${ICON.barcode} Barcode</button>
        <button class="btn" data-quickadd>${ICON.bolt} Schnell-Eintrag</button>
        <button class="btn" data-custom>${ICON.edit} Eigenes Produkt</button>
        <button class="btn" data-recipe>${ICON.pot} Rezept</button>
      </div>
      <div id="tabs" class="chips scroll"></div>
      <div id="out"></div>
    </div>`,
  });
  bindSeg(s.el, "meal", (m) => { meal = +m; });
  const qIn = $("#q", s.el);
  const out = $("#out", s.el);
  setTimeout(() => { if (window.matchMedia("(pointer:fine)").matches) qIn.focus(); }, 300);

  const renderTabs = () => {
    const tabs = [["recent", "Zuletzt"], ["fav", "Favoriten"], ["own", "Eigene"], ["cats", "Kategorien"]];
    $("#tabs", s.el).innerHTML = q ? "" : tabs.map(([id, l]) => `<button class="chip ${tab === id ? "on" : ""}" data-tab="${id}">${l}</button>`).join("");
    $("#actions", s.el).classList.toggle("hide", !!q);
  };
  let offToken = 0;
  const renderOut = () => {
    renderTabs();
    if (q) {
      const res = searchFoods(q, 50);
      let html = res.length ? `<div class="results">${res.map((f) => resultRow(f)).join("")}</div>` : `<div class="empty">${ICON.search}<p>Nichts in der Offline-Datenbank gefunden.</p></div>`;
      if (OFF.enabled) html += `<div class="section-t"><span class="label">Online · Open Food Facts</span><span class="xs faint" id="offst"></span></div><div id="offres" class="results"></div>`;
      else html += `<div class="note info" style="margin-top:12px">${ICON.globe}<span>Nicht dabei? Lege es über <b>Eigenes Produkt</b> an oder trage es per <b>Schnell-Eintrag</b> ein. In der installierten Version durchsucht Kalorio zusätzlich Millionen Produkte online.</span></div>`;
      html += `<div class="row" style="margin-top:12px"><button class="btn grow" data-custom>${ICON.edit} „${esc(q.slice(0, 24))}“ anlegen</button><button class="btn grow" data-quickadd>${ICON.bolt} Nur kcal eintragen</button></div>`;
      out.innerHTML = html;
      if (OFF.enabled) runOff();
      return;
    }
    if (tab === "recent") {
      const items = App.recents.map((r) => Foods.byId.get(r.id)).filter(Boolean);
      out.innerHTML = items.length ? `<div class="results">${items.slice(0, 40).map((f) => resultRow(f)).join("")}</div>` : `<div class="empty">${ICON.clock}<p>Hier erscheinen deine zuletzt gegessenen Lebensmittel.</p><p class="small faint">Tipp: Das <b>+</b> rechts trägt die übliche Portion mit einem Tipp ein.</p></div>`;
    } else if (tab === "fav") {
      const items = Array.from(App.favs).map((id) => Foods.byId.get(id)).filter(Boolean);
      out.innerHTML = items.length ? `<div class="results">${items.map((f) => resultRow(f)).join("")}</div>` : `<div class="empty">${ICON.star}<p>Markiere Lebensmittel mit dem Stern, um sie hier schnell zu finden.</p></div>`;
    } else if (tab === "own") {
      const items = Foods.list.filter((f) => f.s === "U").sort((a, b) => a.n.localeCompare(b.n, "de"));
      out.innerHTML = items.length ? `<div class="results">${items.map((f) => resultRow(f)).join("")}</div>` : `<div class="empty">${ICON.edit}<p>Noch keine eigenen Produkte oder Rezepte.</p></div>`;
    } else if (tab === "cats") {
      if (catSel == null) {
        const counts = new Map();
        for (const f of Foods.list) counts.set(f.cat, (counts.get(f.cat) || 0) + 1);
        out.innerHTML = `<div class="results">${Array.from(counts.entries()).map(([c, n]) => `<button class="res" data-cat="${esc(c)}"><div class="grow"><div class="r-n">${esc(c)}</div></div><span class="faint num small">${fmt(n)}</span>${ICON.right.replace("<svg", '<svg width="18" height="18"')}</button>`).join("")}</div>`;
      } else {
        const items = Foods.list.filter((f) => f.cat === catSel);
        out.innerHTML = `<button class="btn ghost sm" data-catback>${ICON.left} Alle Kategorien</button><h3 style="margin:8px 0 4px">${esc(catSel)}</h3><div class="results">${items.map((f) => resultRow(f)).join("")}</div>`;
      }
    }
  };
  const runOff = debounce(async () => {
    const my = ++offToken;
    const st = $("#offst", s.el), box = $("#offres", s.el);
    if (!st || !box) return;
    if (q.trim().length < 3) { st.textContent = "ab 3 Zeichen"; return; }
    st.textContent = "sucht…";
    try {
      const res = await offSearch(q.trim());
      if (my !== offToken || !$("#offres", s.el)) return;
      const localIds = new Set(searchFoods(q, 50).map((f) => f.id));
      const fresh = res.filter((f) => !localIds.has(f.id));
      st.textContent = fresh.length ? `${fresh.length} Treffer` : "keine weiteren Treffer";
      box.innerHTML = fresh.map((f) => { if (!Foods.byId.has(f.id)) Foods.byId.set(f.id, prepFood(f)); return resultRow(Foods.byId.get(f.id)); }).join("");
    } catch (e) {
      if (my !== offToken || !st) return;
      st.textContent = e.message === "ratelimit" ? "kurz warten – zu viele Suchen" : navigator.onLine === false ? "offline" : "nicht erreichbar";
    }
  }, 650);

  qIn.addEventListener("input", () => { q = qIn.value; $("#qclear", s.el).classList.toggle("hide", !q); renderOut(); });
  $("#qclear", s.el).onclick = () => { qIn.value = ""; q = ""; $("#qclear", s.el).classList.add("hide"); renderOut(); qIn.focus(); };
  s.el.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-quick],[data-food],[data-tab],[data-cat],[data-catback],[data-scan],[data-quickadd],[data-custom],[data-recipe]");
    if (!b) return;
    if (b.dataset.quick) {
      e.stopPropagation();
      const f = Foods.byId.get(b.dataset.quick); if (!f) return;
      const r = App.recents.find((x) => x.id === f.id);
      const dp = defaultPortion(f);
      const amount = r ? r.amount : dp.g;
      const entry = makeEntry(f, amount, meal, r ? r.label : dp.label, r ? r.qty : 1);
      await rememberOff(f);
      await addEntry(k, entry);
      toast(`${esc(f.n)} · ${fmt(entry.k)} kcal`, { label: "Rückgängig", fn: async () => { await removeEntry(k, entry.id); render(); } });
      render(); return;
    }
    if (b.dataset.food) { const f = Foods.byId.get(b.dataset.food); if (f) openFoodDetail(f, k, meal, null, () => { render(); }); return; }
    if (b.dataset.tab) { tab = b.dataset.tab; catSel = null; renderOut(); return; }
    if (b.dataset.cat) { catSel = b.dataset.cat; renderOut(); $(".sheet-b", s.el).scrollTop = 0; return; }
    if (b.hasAttribute("data-catback")) { catSel = null; renderOut(); return; }
    if (b.hasAttribute("data-scan")) { openScanner(k, meal); return; }
    if (b.hasAttribute("data-quickadd")) { openQuickAdd(k, meal, q); return; }
    if (b.hasAttribute("data-custom")) { openCustomFood(null, { name: q }, (f) => { openFoodDetail(f, k, meal); }); return; }
    if (b.hasAttribute("data-recipe")) { openRecipe(); return; }
  });
  s.el.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches(".res")) e.target.click(); });
  renderOut();
  return s;
}

/* Detailansicht mit Mengenwahl */
function openFoodDetail(food, k, meal, editEntry, after) {
  const portions = [...(food.po || [])];
  const unitOpts = portions.map((p, i) => ({ id: "p" + i, label: p[0], g: p[1] }));
  unitOpts.push({ id: "g", label: food.u === "ml" ? "Milliliter (ml)" : "Gramm (g)", g: 1 });
  let unit, qty;
  if (editEntry) {
    const match = editEntry.label && unitOpts.find((u) => u.label === editEntry.label);
    if (match && editEntry.qty) { unit = match.id; qty = editEntry.qty; } else { unit = "g"; qty = editEntry.amount; }
  } else {
    const r = App.recents.find((x) => x.id === food.id);
    const m = r && r.label && unitOpts.find((u) => u.label === r.label);
    if (m) { unit = m.id; qty = r.qty || 1; }
    else if (unitOpts.length > 1) { unit = unitOpts[0].id; qty = 1; }
    else { unit = "g"; qty = 100; }
  }
  const fav = () => App.favs.has(food.id);
  const body = `<div class="stack s16">
    <div class="stack s4"><div class="row wrap"><span class="label">${esc(food.cat || "")}</span>${srcBadge(food)}</div>${food.b ? `<span class="muted">${esc(food.b)}</span>` : ""}${food.code ? `<span class="xs faint num">EAN ${esc(food.code)}</span>` : ""}</div>
    <div class="amount">
      <div class="stepper"><button data-step="-1" aria-label="Weniger">−</button><input id="d_qty" inputmode="decimal" value="${fmt(qty, 2).replace(/\./g, "")}" aria-label="Menge"><button data-step="1" aria-label="Mehr">+</button></div>
      <select class="input" id="d_unit" aria-label="Einheit">${unitOpts.map((u) => `<option value="${u.id}" ${u.id === unit ? "selected" : ""}>${esc(u.label)}${u.id !== "g" ? ` (${fmt(u.g)} ${food.u})` : ""}</option>`).join("")}</select>
    </div>
    <div class="row between" style="align-items:flex-end">
      <div><div class="big-kcal" id="d_k">0</div><div class="small muted">kcal · <span id="d_g" class="num"></span></div></div>
      <div class="stack s4 small num" style="text-align:right">
        <span><span class="dot" style="background:var(--pro)"></span> Eiweiß <b id="d_p"></b></span>
        <span><span class="dot" style="background:var(--carb)"></span> Kohlenh. <b id="d_h"></b></span>
        <span><span class="dot" style="background:var(--fat)"></span> Fett <b id="d_f"></b></span>
      </div>
    </div>
    <div class="field"><span>Mahlzeit</span>${seg("dmeal", MEALS.map((m, i) => [i, m.replace("Mittagessen", "Mittag").replace("Abendessen", "Abend").replace("Frühstück", "Früh")]), meal)}</div>
    <div class="card tight">
      <table class="label-table">
        <thead><tr><th>Nährwerte</th><th>pro 100 ${food.u}</th><th id="d_colh">Portion</th></tr></thead>
        <tbody id="d_tab"></tbody>
      </table>
    </div>
    <p class="xs faint">${srcText(food)}</p>
    <div class="row wrap">
      <button class="btn sm" data-fav>${fav() ? ICON.starF : ICON.star} ${fav() ? "Favorit" : "Als Favorit"}</button>
      ${food.s === "U" ? `<button class="btn sm" data-editfood>${ICON.edit} Produkt bearbeiten</button>` : ""}
      ${food.s !== "U" && food.s !== "B" ? `<button class="btn sm" data-correct>${ICON.edit} Werte korrigieren</button>` : ""}
    </div>
  </div>`;
  const s = openSheet({
    title: esc(food.n), body,
    foot: editEntry ? `<button class="btn danger" data-del aria-label="Löschen">${ICON.trash}</button><button class="btn primary grow" data-save>${ICON.check} Speichern</button>` : `<button class="btn primary block" data-save>${ICON.plus} Hinzufügen</button>`,
  });
  bindSeg(s.el, "dmeal", (m) => { meal = +m; });
  const qIn = $("#d_qty", s.el), uSel = $("#d_unit", s.el);
  const amount = () => { const u = unitOpts.find((x) => x.id === uSel.value); const qv = parseNum(qIn.value); return (isNaN(qv) ? 0 : qv) * u.g; };
  let lastAmount = 0;
  const upd = () => {
    const a = amount(); lastAmount = a; const n = nutr(food, a);
    $("#d_k", s.el).textContent = fmt(n.k);
    $("#d_g", s.el).textContent = `${fmt(a)} ${food.u}`;
    $("#d_p", s.el).textContent = fmt(n.p, 1) + " g";
    $("#d_h", s.el).textContent = fmt(n.h, 1) + " g";
    $("#d_f", s.el).textContent = fmt(n.f, 1) + " g";
    $("#d_colh", s.el).textContent = `${fmt(a)} ${food.u}`;
    const row = (l, v100, cls = "", unitS = "g", d = 1) => `<tr class="${cls}"><td>${l}</td><td>${v100 == null ? "–" : fmt(v100, d) + " " + unitS}</td><td>${v100 == null ? "–" : fmt(v100 * a / 100, d) + " " + unitS}</td></tr>`;
    $("#d_tab", s.el).innerHTML = `
      <tr class="strong"><td>Brennwert</td><td>${fmt(food.k * 4.184)} kJ<br>${fmt(food.k)} kcal</td><td>${fmt(food.k * 4.184 * a / 100)} kJ<br>${fmt(food.k * a / 100)} kcal</td></tr>
      ${row("Fett", food.f)}${row("Kohlenhydrate", food.h)}${row("davon Zucker", food.z, "sub")}${row("Ballaststoffe", food.bs)}${row("Eiweiß", food.p)}`;
  };
  qIn.addEventListener("input", upd);
  qIn.addEventListener("focus", () => qIn.select());
  uSel.addEventListener("change", () => { qIn.value = uSel.value === "g" ? String(Math.round(lastAmount || 100)) : "1"; upd(); });
  s.el.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.step) {
      const g = uSel.value === "g";
      let v2 = parseNum(qIn.value) || 0;
      const st = g ? (v2 >= 100 ? 10 : 5) : (v2 < 1 || (v2 === 1 && +b.dataset.step < 0) ? 0.25 : 0.5);
      v2 = Math.max(0, round(v2 + st * +b.dataset.step, 2));
      qIn.value = fmt(v2, 2).replace(/\./g, ""); upd(); return;
    }
    if (b.hasAttribute("data-fav")) { await toggleFav(food.id); b.innerHTML = `${fav() ? ICON.starF : ICON.star} ${fav() ? "Favorit" : "Als Favorit"}`; return; }
    if (b.hasAttribute("data-editfood")) { s.close(); openCustomFood(food, null, (f) => openFoodDetail(f, k, meal, editEntry, after)); return; }
    if (b.hasAttribute("data-correct")) { s.close(); openCustomFood(null, { from: food }, (f) => openFoodDetail(f, k, meal, editEntry, after)); return; }
    if (b.hasAttribute("data-del")) {
      const removed = await removeEntry(k, editEntry.id);
      s.close(); render();
      toast("Eintrag gelöscht", { label: "Rückgängig", fn: async () => { getDay(k).entries.push(removed); await saveDay(k); render(); } });
      return;
    }
    if (b.hasAttribute("data-save")) {
      const a = amount();
      if (!(a > 0)) { toast("Bitte eine Menge eingeben"); return; }
      const u = unitOpts.find((x) => x.id === uSel.value);
      const entry = makeEntry(food, a, meal, u.id === "g" ? null : u.label, u.id === "g" ? null : parseNum(qIn.value));
      await rememberOff(food);
      if (editEntry) {
        const d = getDay(k); const i = d.entries.findIndex((x) => x.id === editEntry.id);
        entry.id = editEntry.id; entry.t = editEntry.t;
        if (i >= 0) d.entries[i] = entry; await saveDay(k);
        toast("Gespeichert");
      } else {
        await addEntry(k, entry);
        toast(`${esc(food.n)} · ${fmt(entry.k)} kcal hinzugefügt`, { label: "Rückgängig", fn: async () => { await removeEntry(k, entry.id); render(); } });
      }
      s.close();
      // Such-Sheet offen lassen, damit man weitere Lebensmittel eintragen kann
      render(); if (after) after();
    }
  });
  upd();
}

/* Schnell-Eintrag: nur Kalorien (optional Makros) */
function openQuickAdd(k, meal, name) {
  const s = openSheet({
    title: "Schnell-Eintrag",
    body: `<div class="stack">
      <label class="field"><span>Bezeichnung</span><input class="input" id="qa_n" value="${esc(name || "")}" placeholder="z. B. Kuchen bei Oma"></label>
      ${numField("qa_k", "Kalorien", "", "kcal")}
      <div class="grid3">${numField("qa_p", "Eiweiß", "", "g")}${numField("qa_h", "Kohlenh.", "", "g")}${numField("qa_f", "Fett", "", "g")}</div>
      <p class="xs faint">Makros sind optional. Leer gelassene Felder zählen als 0.</p>
    </div>`,
    foot: `<button class="btn primary block" data-save>${ICON.plus} Eintragen</button>`,
  });
  $("[data-save]", s.el).onclick = async () => {
    const kc = readNum("qa_k");
    if (!(kc >= 0)) { toast("Bitte Kalorien eingeben"); return; }
    const v = (id) => { const x = readNum(id); return isNaN(x) ? 0 : x; };
    const e = { id: uid(), meal, fid: "q:" + uid(), n: $("#qa_n").value.trim() || "Schnell-Eintrag", b: "", u: "g", amount: 0, k: kc, p: v("qa_p"), h: v("qa_h"), f: v("qa_f"), z: 0, bs: 0, per: null, t: Date.now() };
    await addEntry(k, e); s.close(); toast(`${fmt(kc)} kcal eingetragen`); render();
  };
}

/* Eigenes Produkt anlegen / bearbeiten / Werte korrigieren */
function openCustomFood(food, opts, onSaved) {
  opts = opts || {};
  const src = food || opts.from || {};
  const editing = !!food;
  const po = src.po && src.po.length ? src.po[0] : null;
  const s = openSheet({
    title: editing ? "Produkt bearbeiten" : opts.from ? "Werte korrigieren" : "Eigenes Produkt",
    body: `<div class="stack">
      ${opts.from ? `<div class="note info">${ICON.info}<span>Kalorio legt eine korrigierte Kopie als eigenes Produkt an. Das Original bleibt unverändert.</span></div>` : ""}
      <label class="field"><span>Name</span><input class="input" id="cf_n" value="${esc(src.n || opts.name || "")}" placeholder="z. B. K-Classic Cola"></label>
      <label class="field"><span>Marke (optional)</span><input class="input" id="cf_b" value="${esc(src.b || "")}"></label>
      <div class="grid2">
        <label class="field"><span>Barcode (optional)</span><input class="input" id="cf_code" inputmode="numeric" value="${esc(src.code || opts.code || "")}"></label>
        <div class="field"><span>Einheit</span>${seg("cfu", [["g", "pro 100 g"], ["ml", "pro 100 ml"]], src.u || "g")}</div>
      </div>
      <p class="label" style="margin-top:6px">Nährwerte pro 100 (wie auf der Verpackung)</p>
      <div class="grid2">${numField("cf_k", "Brennwert", src.k ?? "", "kcal")}${numField("cf_kj", "oder Brennwert", "", "kJ")}</div>
      <div class="grid3">${numField("cf_f", "Fett", src.f ?? "", "g")}${numField("cf_h", "Kohlenhydrate", src.h ?? "", "g")}${numField("cf_p", "Eiweiß", src.p ?? "", "g")}</div>
      <div class="grid2">${numField("cf_z", "davon Zucker", src.z ?? "", "g")}${numField("cf_bs", "Ballaststoffe", src.bs ?? "", "g")}</div>
      <p class="label" style="margin-top:6px">Portion (optional)</p>
      <div class="grid2"><label class="field"><span>Bezeichnung</span><input class="input" id="cf_pl" value="${esc(po ? po[0] : "")}" placeholder="z. B. 1 Flasche"></label>${numField("cf_pg", "Menge", po ? po[1] : "", "g/ml")}</div>
      <p class="xs faint" id="cf_check"></p>
    </div>`,
    foot: `${editing ? `<button class="btn danger" data-del aria-label="Produkt löschen">${ICON.trash}</button>` : ""}<button class="btn primary grow" data-save>${ICON.check} Speichern</button>`,
  });
  let unit = src.u || "g";
  bindSeg(s.el, "cfu", (u) => { unit = u; });
  const chk = () => {
    const k = readNum("cf_k"), p = readNum("cf_p") || 0, h = readNum("cf_h") || 0, f = readNum("cf_f") || 0;
    const calc = 4 * p + 4 * h + 9 * f;
    const el = $("#cf_check", s.el);
    if (k > 0 && calc > 0 && Math.abs(calc - k) / k > 0.2 && Math.abs(calc - k) > 20) el.innerHTML = `${ICON.warn.replace("<svg", '<svg width="14" height="14" style="vertical-align:-2px"')} Aus den Makros ergeben sich ca. ${fmt(calc)} kcal. Prüfe die Angaben (Alkohol und Zuckeralkohole können die Abweichung erklären).`;
    else el.textContent = "";
  };
  $("#cf_kj", s.el).addEventListener("input", () => { const kj = readNum("cf_kj"); if (kj > 0) $("#cf_k", s.el).value = fmt(kj / 4.184, 1).replace(/\./g, ""); chk(); });
  s.el.addEventListener("input", chk);
  $("[data-save]", s.el).onclick = async () => {
    const n = $("#cf_n", s.el).value.trim();
    const k = readNum("cf_k");
    if (!n) { toast("Bitte einen Namen eingeben"); return; }
    if (!(k >= 0 && k <= 900)) { toast("Brennwert bitte in kcal pro 100 angeben (0–900)"); return; }
    const v = (id) => { const x = readNum(id); return isNaN(x) ? 0 : x; };
    const vo = (id) => { const x = readNum(id); return isNaN(x) ? null : x; };
    const pl = $("#cf_pl", s.el).value.trim(), pg = readNum("cf_pg");
    const code = $("#cf_code", s.el).value.replace(/\D/g, "");
    const f = {
      id: editing ? food.id : "u:" + uid(), n, b: $("#cf_b", s.el).value.trim(), cat: "Eigene Produkte", u: unit,
      k: round(k, 1), p: v("cf_p"), h: v("cf_h"), f: v("cf_f"), z: vo("cf_z"), bs: vo("cf_bs"),
      po: pg > 0 ? [[pl || "1 Portion", pg]] : [], s: "U", code: code || null,
    };
    if (f.p + f.h + f.f > 100.5) { toast("Fett + Kohlenhydrate + Eiweiß können zusammen nicht über 100 g liegen"); return; }
    await Store.set("custom", f.id, stripFood(f));
    addFoodToIndex(f);
    s.close(); toast(editing ? "Produkt gespeichert" : "Produkt angelegt");
    if (onSaved) onSaved(Foods.byId.get(f.id));
  };
  const del = $("[data-del]", s.el);
  if (del) del.onclick = async () => {
    if (!(await confirmSheet("Produkt löschen?", `„${esc(food.n)}“ wird aus deinen eigenen Produkten entfernt. Bisherige Tagebucheinträge bleiben erhalten.`, "Löschen", true))) return;
    await Store.del("custom", food.id); removeFoodFromIndex(food.id); App.favs.delete(food.id);
    s.close(); toast("Produkt gelöscht"); render();
  };
  chk();
}

/* Rezept-Rechner: Zutaten summieren, auf 100 g umrechnen, als eigenes Produkt speichern */
function openRecipe() {
  const items = []; // {food, g}
  const s = openSheet({
    title: "Rezept erstellen", full: true,
    body: `<div class="stack">
      <label class="field"><span>Name des Gerichts</span><input class="input" id="rc_n" placeholder="z. B. Omas Gulasch"></label>
      <div class="search">${ICON.search}<input class="input" id="rc_q" type="search" placeholder="Zutat suchen…" autocomplete="off"></div>
      <div id="rc_res" class="results"></div>
      <div class="card tight stack" id="rc_list"></div>
      <div class="grid2">${numField("rc_total", "Gewicht fertig gekocht", "", "g")}${numField("rc_serv", "Portionen", 4, "")}</div>
      <p class="xs faint">Beim Kochen verdunstet Wasser. Wiege das fertige Gericht für genaue Werte pro 100 g – ohne Angabe wird die Summe der Zutaten verwendet.</p>
      <div class="tile" id="rc_sum"></div>
    </div>`,
    foot: `<button class="btn primary block" data-save>${ICON.check} Als eigenes Produkt speichern</button>`,
  });
  const q = $("#rc_q", s.el);
  const draw = () => {
    const tot = items.reduce((a, it) => { const n = nutr(it.food, it.g); a.k += n.k; a.p += n.p; a.h += n.h; a.f += n.f; a.g += it.g; return a; }, { k: 0, p: 0, h: 0, f: 0, g: 0 });
    $("#rc_list", s.el).innerHTML = items.length ? items.map((it, i) => `<div class="row"><div class="grow small"><b>${esc(it.food.n)}</b></div><div class="input-wrap" style="width:110px"><input class="input" data-rcg="${i}" inputmode="decimal" value="${fmt(it.g).replace(/\./g, "")}"><span class="suffix">${it.food.u}</span></div><button class="icon-btn plain" data-rcrm="${i}" aria-label="Entfernen">${ICON.trash}</button></div>`).join("") : `<p class="small muted">Noch keine Zutaten. Suche oben und tippe auf eine Zutat.</p>`;
    const total = readNum("rc_total") > 0 ? readNum("rc_total") : tot.g;
    const serv = readNum("rc_serv") > 0 ? readNum("rc_serv") : 1;
    $("#rc_sum", s.el).innerHTML = `<span class="label">Gesamt</span><div class="t-v">${fmt(tot.k)} kcal</div><div class="t-s num">${fmt(tot.p)} g E · ${fmt(tot.h)} g KH · ${fmt(tot.f)} g F · pro 100 g: ${total ? fmt(tot.k / total * 100) : 0} kcal · pro Portion: ${fmt(tot.k / serv)} kcal</div>`;
    return { tot, total, serv };
  };
  q.addEventListener("input", () => {
    const res = q.value ? searchFoods(q.value, 8) : [];
    $("#rc_res", s.el).innerHTML = res.map((f) => `<button class="res" data-rcadd="${esc(f.id)}"><div class="grow"><div class="r-n">${esc(f.n)}</div><div class="r-b">${esc(f.b || "")}</div></div><span class="r-k"><b>${fmt(f.k)}</b><span>/100${f.u}</span></span></button>`).join("");
  });
  s.el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.rcadd) { const f = Foods.byId.get(b.dataset.rcadd); items.push({ food: f, g: defaultPortion(f).g }); q.value = ""; $("#rc_res", s.el).innerHTML = ""; draw(); return; }
    if (b.dataset.rcrm) { items.splice(+b.dataset.rcrm, 1); draw(); }
  });
  s.el.addEventListener("input", (e) => { if (e.target.dataset.rcg) { items[+e.target.dataset.rcg].g = parseNum(e.target.value) || 0; draw(); } else if (e.target.id === "rc_total" || e.target.id === "rc_serv") draw(); });
  $("[data-save]", s.el).onclick = async () => {
    const n = $("#rc_n", s.el).value.trim();
    if (!n) { toast("Bitte gib dem Rezept einen Namen"); return; }
    if (!items.length) { toast("Füge mindestens eine Zutat hinzu"); return; }
    const { tot, total, serv } = draw();
    const per = (x) => round(x / total * 100, 1);
    const sumZ = items.reduce((a, it) => a + (it.food.z || 0) * it.g / 100, 0), sumB = items.reduce((a, it) => a + (it.food.bs || 0) * it.g / 100, 0);
    const f = { id: "u:" + uid(), n, b: "Rezept", cat: "Eigene Produkte", u: "g", k: per(tot.k), p: per(tot.p), h: per(tot.h), f: per(tot.f), z: per(sumZ), bs: per(sumB), po: [["1 Portion", round(total / serv)], ["Ganzes Rezept", round(total)]], s: "U" };
    await Store.set("custom", f.id, stripFood(f)); addFoodToIndex(f);
    s.close(); toast(`Rezept „${esc(n)}“ gespeichert`);
  };
  draw();
}

/* ===== Scanner-Sheet ===== */
function openScanner(k, meal) {
  const s = openSheet({
    title: "Barcode scannen",
    body: `<div class="stack">
      <div class="scanner-box" id="sc_box"><video id="sc_v" playsinline muted autoplay></video><div class="frame"></div><div class="laser"></div></div>
      <p class="small muted" id="sc_msg">Kamera wird gestartet … Halte den Strichcode ruhig in den Rahmen.</p>
      <div class="grid2">
        <label class="btn" for="sc_file">${ICON.camera} Foto vom Barcode</label>
        <button class="btn" data-manual>${ICON.edit} Nummer eintippen</button>
      </div>
      <input type="file" id="sc_file" accept="image/*" capture="environment" class="hide">
      <div id="sc_manual" class="hide stack">
        <div class="row"><input class="input grow" id="sc_code" inputmode="numeric" placeholder="EAN, z. B. 4000417025005" autocomplete="off"><button class="btn primary" data-lookup>Suchen</button></div>
      </div>
      <div id="sc_out"></div>
    </div>`,
    onClose: () => Scanner.stop(),
  });
  const msg = $("#sc_msg", s.el);
  const lookup = async (code) => {
    code = String(code).replace(/\D/g, "");
    if (!code) return;
    Scanner.stop();
    $("#sc_box", s.el).classList.add("hide");
    msg.innerHTML = `Barcode <b class="num">${esc(code)}</b> erkannt – suche Produkt …`;
    let offErr = false;
    let f = Foods.byCode.get(code) || Foods.byCode.get(code.replace(/^0+/, "")) || Foods.byCode.get("0" + code);
    if (!f && OFF.enabled) {
      try { f = await offProduct(code); } catch (e) { offErr = true; msg.innerHTML = `Barcode <b class="num">${esc(code)}</b> – Online-Datenbank gerade nicht erreichbar${navigator.onLine === false ? " (offline)" : ""}.`; }
    }
    if (s.closed) return;
    if (f) {
      if (f.s === "O") { await rememberOff(f); f = Foods.byId.get(f.id); }
      s.close();
      openFoodDetail(f, k, meal, null, () => {});
      return;
    }
    $("#sc_out", s.el).innerHTML = `<div class="card stack">
      <h3>Produkt nicht gefunden</h3>
      <p class="small muted">${OFF.enabled && !offErr ? "Weder lokal noch in Open Food Facts bekannt." : offErr ? "Lokal unbekannt, und die Online-Datenbank ist gerade nicht erreichbar." : "Dieses Produkt ist noch nicht in deiner Datenbank."} Trage die Werte einmal von der Verpackung ein – beim nächsten Scan erkennt Kalorio es sofort.</p>
      <button class="btn primary" data-create="${esc(code)}">${ICON.plus} Produkt mit Barcode anlegen</button>
      <button class="btn" data-search>${ICON.search} Stattdessen nach Namen suchen</button>
    </div>`;
  };
  const startCam = () => {
    Scanner.start($("#sc_v", s.el), (code) => lookup(code), (err) => {
      $("#sc_box", s.el).classList.add("hide");
      msg.innerHTML = err === "denied" ? "Kamerazugriff wurde nicht erlaubt. Du kannst ein <b>Foto vom Barcode</b> machen oder die Nummer eintippen." : err === "nolib" ? "Der Live-Scanner konnte nicht geladen werden. Nutze <b>Foto vom Barcode</b> oder tippe die Nummer ein." : "Live-Kamera ist hier nicht verfügbar. Mach ein <b>Foto vom Barcode</b> – Kalorio liest die Nummer daraus – oder tippe sie ein.";
    });
    setTimeout(() => { if (Scanner.active && Scanner.stream) msg.textContent = "Halte den Strichcode ruhig in den Rahmen – Abstand ca. 15–25 cm."; }, 800);
  };
  startCam();
  $("#sc_file", s.el).addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    msg.textContent = "Lese Barcode aus dem Foto …";
    try { const code = await Scanner.fromImage(file); await lookup(code); }
    catch (err) { msg.innerHTML = "Im Foto wurde kein Barcode erkannt. Fotografiere den Strichcode möglichst gerade, scharf und formatfüllend – oder tippe die Nummer ein."; }
    e.target.value = "";
  });
  s.el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-manual")) { $("#sc_manual", s.el).classList.remove("hide"); $("#sc_code", s.el).focus(); return; }
    if (b.hasAttribute("data-lookup")) { lookup($("#sc_code", s.el).value); return; }
    if (b.dataset.create) { const code = b.dataset.create; s.close(); openCustomFood(null, { code }, (f) => openFoodDetail(f, k, meal)); return; }
    if (b.hasAttribute("data-search")) { s.close(); openAddSheet(k, meal); }
  });
  $("#sc_code", s.el).addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(e.target.value); });
}

/* ===== Ansichten: Gewicht & Statistik ===== */
let weightRange = 90;
let statRange = 7;

function niceTicks(min, max, n = 4) {
  const span = max - min || 1;
  const step0 = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + 1e-9; v += step) t.push(round(v, 4));
  return t;
}

function weightChart(series, target) {
  if (series.length < 2) return `<div class="empty">${ICON.chart}<p>Ab zwei Einträgen siehst du hier deinen Verlauf.</p></div>`;
  const W = 340, H = 190, L = 34, R = 10, T = 12, Bm = 24;
  const keys = series.map((s) => s[0]);
  const x0 = keys[0], span = Math.max(1, ddiff(x0, keys[keys.length - 1]));
  const vals = series.flatMap((s) => [s[1], s[2]]).concat(target ? [target] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 2) { mn -= 1; mx += 1; }
  const ticks = niceTicks(mn - 0.3, mx + 0.3, 4);
  mn = ticks[0]; mx = ticks[ticks.length - 1];
  const X = (k) => L + (ddiff(x0, k) / span) * (W - L - R);
  const Y = (v) => T + (1 - (v - mn) / (mx - mn)) * (H - T - Bm);
  const grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(t) + 3}" text-anchor="end">${fmt(t, 1)}</text>`).join("");
  const trendPath = series.map((s, i) => `${i ? "L" : "M"}${X(s[0]).toFixed(1)},${Y(s[2]).toFixed(1)}`).join(" ");
  const area = `${trendPath} L${X(keys[keys.length - 1]).toFixed(1)},${H - Bm} L${X(x0).toFixed(1)},${H - Bm} Z`;
  const dots = series.map((s) => `<circle cx="${X(s[0]).toFixed(1)}" cy="${Y(s[1]).toFixed(1)}" r="2.6" fill="var(--fg3)"/>`).join("");
  const last = series[series.length - 1];
  const labelsX = [keys[0], keys[Math.floor(keys.length / 2)], keys[keys.length - 1]].filter((v, i, a) => a.indexOf(v) === i)
    .map((k, i, a) => `<text x="${X(k)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === a.length - 1 ? "end" : "middle"}">${dshort(k)}</text>`).join("");
  const tgt = target && target >= mn && target <= mx ? `<line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${Y(target) - 4}" text-anchor="end" style="fill:var(--good)">Ziel ${fmt(target, 1)}</text>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tgt}<path d="${area}" fill="url(#wg)"/>${dots}<path d="${trendPath}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[2])}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>${labelsX}</svg></div>`;
}

function renderWeight(v) {
  const today = dkey();
  const tr = trendSeries();
  const cutoff = weightRange ? daddKey(today, -weightRange) : "0000";
  const shown = tr.filter((x) => x[0] >= cutoff);
  const cur = tr.length ? tr[tr.length - 1][2] : latestWeight();
  const start = App.profile.startWeight || (tr[0] && tr[0][1]) || cur;
  const tw = App.profile.targetWeight;
  const todayW = App.weights.get(today);
  // Trend der letzten 14–28 Tage (kg/Woche)
  let rate = null;
  if (tr.length >= 3) {
    const end = tr[tr.length - 1];
    const ref = tr.filter((x) => ddiff(x[0], end[0]) <= 28)[0];
    const days = ddiff(ref[0], end[0]);
    if (days >= 10) rate = (end[2] - ref[2]) / days * 7;
  }
  let eta = "";
  if (tw && cur) {
    const r = rate && Math.sign(rate) === Math.sign(tw - cur) && Math.abs(rate) > 0.02 ? rate : App.plan.kgWeek;
    if (r && Math.sign(r) === Math.sign(tw - cur)) { const d = new Date(); d.setDate(d.getDate() + Math.round(Math.abs((tw - cur) / r) * 7)); eta = dlong(d); }
    if (Math.abs(tw - cur) < 0.3) eta = "erreicht";
  }
  v.innerHTML = `${topbar()}
  <div class="view">
    <h1>Gewicht</h1>
    <section class="card stack">
      <div class="row between"><h3>Heute wiegen</h3>${todayW ? `<span class="pill good">${ICON.check} ${fmt(todayW, 1)} kg eingetragen</span>` : ""}</div>
      <div class="row">
        <div class="stepper grow"><button data-ws="-0.1" aria-label="0,1 kg weniger">−</button><input id="w_in" inputmode="decimal" value="${fmt(todayW || latestWeight() || 70, 1)}" aria-label="Gewicht in kg"><button data-ws="0.1" aria-label="0,1 kg mehr">+</button></div>
        <button class="btn primary" data-wsave>Speichern</button>
      </div>
      <p class="xs faint">Am besten morgens nach dem Toilettengang, vor dem Frühstück. Kalorio glättet Schwankungen über einen Trend und passt deinen Bedarf automatisch an.</p>
    </section>
    <div class="stat-tiles">
      <div class="tile"><span class="label">Trend aktuell</span><div class="t-v">${fmt(cur, 1)} kg</div><div class="t-s">${rate != null ? `${fmtSigned(rate, 2)} kg/Woche` : "noch zu wenig Daten"}</div></div>
      <div class="tile"><span class="label">Seit Start</span><div class="t-v" style="color:${cur - start < 0 ? "var(--good)" : cur - start > 0 ? "var(--warn)" : "var(--fg)"}">${fmtSigned(cur - start, 1)} kg</div><div class="t-s">Start ${fmt(start, 1)} kg</div></div>
      <div class="tile"><span class="label">Ziel</span><div class="t-v">${tw ? fmt(tw, 1) + " kg" : "–"}</div><div class="t-s">${tw ? `noch ${fmt(Math.abs(tw - cur), 1)} kg` : "im Profil festlegen"}</div></div>
      <div class="tile"><span class="label">Prognose</span><div class="t-v" style="font-size:19px">${eta || "–"}</div><div class="t-s">${eta && eta !== "erreicht" ? (rate ? "nach aktuellem Trend" : "nach deinem Plan") : ""}</div></div>
    </div>
    <section class="card">
      <div class="card-h"><h3>Verlauf</h3>${seg("wr", [[30, "30 T"], [90, "90 T"], [0, "Alles"]], weightRange)}</div>
      ${weightChart(shown, tw)}

function kcalChart(days, target) {
  const W = 340, H = 180, L = 34, R = 8, T = 10, Bm = 22;
  const vals = days.map((d) => d.k);
  const mx0 = Math.max(target * 1.25, ...vals, 500);
  const ticks = niceTicks(0, mx0, 4);
  const mx = ticks[ticks.length - 1];
  const bw = (W - L - R) / days.length;
  const Y = (v) => T + (1 - v / mx) * (H - T - Bm);
  const grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(t) + 3}" text-anchor="end">${t >= 1000 ? fmt(t / 1000, 1) + "k" : fmt(t)}</text>`).join("");
  const bars = days.map((d, i) => {
    if (!d.k) return "";
    const h = Y(0) - Y(d.k);
    const col = d.k > target * 1.08 ? "var(--bad)" : d.k < target * 0.85 && App.plan.goal === "gain" ? "var(--warn)" : "var(--accent)";
    const x = L + i * bw + bw * 0.18;
    return `<rect x="${x.toFixed(1)}" y="${Y(d.k).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="${Math.min(4, bw * 0.2).toFixed(1)}" fill="${col}"/>`;
  }).join("");
  const step = days.length > 10 ? Math.ceil(days.length / 6) : 1;
  const lbl = days.map((d, i) => (i % step === 0 || i === days.length - 1) && !(i !== days.length - 1 && days.length - 1 - i < step) ? `<text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${days.length <= 7 ? WD[dparse(d.key).getDay()] : dshort(d.key)}</text>` : "").join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien pro Tag">${grid}${bars}
    <line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--fg2)" stroke-dasharray="4 4" stroke-width="1.2"/>
    <text x="${W - R}" y="${Y(target) - 5}" text-anchor="end" style="fill:var(--fg);paint-order:stroke;stroke:var(--s1);stroke-width:4px">Ziel ${fmt(target)}</text>${lbl}</svg></div>`;
}

function renderStats(v) {
  const today = dkey();
  const pl = App.plan;
  const days = [];
  for (let i = statRange - 1; i >= 0; i--) {
    const key = daddKey(today, -i);
    const d = App.days.get(key);
    const t = dayTotals(key);
    days.push({ key, k: d && d.entries.length ? t.k : 0, t, logged: !!(d && d.entries.length) });
  }
  const logged = days.filter((d) => d.logged && d.key !== today); // der laufende Tag zählt erst, wenn er vorbei ist
  const avg = (f) => (logged.length ? logged.reduce((a, d) => a + f(d), 0) / logged.length : 0);
  const avgK = avg((d) => d.k);
  const avgBal = avg((d) => d.k - (pl.tdee + d.t.act));
  const sumBal = logged.reduce((a, d) => a + d.k - (pl.tdee + d.t.act), 0);
  const avgP = avg((d) => d.t.p), avgH = avg((d) => d.t.h), avgF = avg((d) => d.t.f);
  const inTarget = logged.filter((d) => pl.goal === "gain" ? d.k >= pl.target * 0.92 : d.k <= (pl.target + Math.round(d.t.act * App.settings.credit)) * 1.05).length;
  // Serie: aufeinanderfolgende Tage mit Einträgen bis heute/gestern
  let streak = 0; { let k = App.days.get(today) && App.days.get(today).entries.length ? today : daddKey(today, -1); while (App.days.get(k) && App.days.get(k).entries.length) { streak++; k = daddKey(k, -1); } }
  const kcalFromMacros = avgP * 4 + avgH * 4 + avgF * 9 || 1;
  const ad = adaptiveTDEE();
  v.innerHTML = `${topbar()}
  <div class="view">
    <div class="row between"><h1>Statistik</h1>${seg("sr", [[7, "7 Tage"], [30, "30 Tage"]], statRange)}</div>
    <section class="card">
      <div class="card-h"><h3>Kalorien pro Tag</h3><span class="small muted num">${days.filter((d) => d.logged).length}/${statRange} Tage erfasst</span></div>
      ${kcalChart(days, pl.target)}
      <p class="xs faint" style="margin-top:6px">Durchschnitte und Bilanz berücksichtigen nur abgeschlossene Tage – heute zählt ab morgen mit.</p>
    </section>
    <div class="stat-tiles">
      <div class="tile"><span class="label">Ø Kalorien</span><div class="t-v">${logged.length ? fmt(avgK) : "–"}</div><div class="t-s">Ziel ${fmt(pl.target)}</div></div>
      <div class="tile"><span class="label">Ø Bilanz / Tag</span><div class="t-v" style="color:${!logged.length ? "var(--fg)" : avgBal < 0 ? "var(--good)" : "var(--bad)"}">${logged.length ? fmtSigned(avgBal) : "–"}</div><div class="t-s">vs. geschätztem Verbrauch</div></div>
      <div class="tile"><span class="label">Rechnerisch</span><div class="t-v">${logged.length ? fmtSigned(sumBal / KCAL_PER_KG_LOSS, 2) + " kg" : "–"}</div><div class="t-s">Fett im Zeitraum (7.700 kcal/kg)</div></div>
      <div class="tile"><span class="label">Im Ziel</span><div class="t-v">${logged.length ? `${inTarget}/${logged.length}` : "–"}</div><div class="t-s">Tage · Serie ${streak} ${streak === 1 ? "Tag" : "Tage"}</div></div>
    </div>
    <section class="card stack">
      <h3>Ø Nährstoffe</h3>
      ${logged.length ? `<div class="bar" style="height:12px;display:flex">
        <i style="width:${avgP * 4 / kcalFromMacros * 100}%;background:var(--pro);border-radius:0"></i><i style="width:${avgH * 4 / kcalFromMacros * 100}%;background:var(--carb);border-radius:0"></i><i style="width:${avgF * 9 / kcalFromMacros * 100}%;background:var(--fat);border-radius:0"></i></div>
      <div class="macros">${macroBar("Eiweiß", avgP, pl.protein, "var(--pro)")}${macroBar("Kohlenh.", avgH, pl.carbs, "var(--carb)")}${macroBar("Fett", avgF, pl.fat, "var(--fat)")}</div>
      ${avgP < pl.protein * 0.8 ? `<div class="note warn">${ICON.info}<span>Du liegst im Schnitt ${fmt(pl.protein - avgP)} g unter deinem Eiweißziel. Einfache Quellen: Skyr, Magerquark, Hüttenkäse, Eier, Hähnchen, Thunfisch, Linsen, Tofu.</span></div>` : ""}` : `<p class="muted small">Sobald du Mahlzeiten einträgst, erscheinen hier deine Durchschnittswerte.</p>`}
    </section>
    <section class="card stack">
      <div class="row between"><h3>Gemessener Verbrauch</h3><span class="chip">${ICON.bolt} adaptiv</span></div>
      ${ad && ad.tdee ? `<div class="result-big"><span class="n" style="font-size:38px">${fmt(ad.tdee)}</span><span class="muted">kcal / Tag</span></div>
        <p class="small muted">Aus ${ad.span} Tagen: Ø ${fmt(ad.avgIn)} kcal gegessen, Trendgewicht ${fmtSigned(ad.dKg, 1)} kg. Berechnet: ${fmt(pl.tdee)} kcal (${fmtSigned(ad.tdee - pl.tdee)}).</p>
        ${Math.abs(ad.tdee - pl.tdee) > 150 ? `<p class="small">Dein tatsächlicher Verbrauch weicht deutlich von der Formel ab. Passe bei Bedarf deine Alltagsaktivität im Profil an – oder übernimm den gemessenen Wert.</p><button class="btn" data-adopt="${ad.tdee}">Gemessenen Verbrauch übernehmen</button>` : `<div class="note info">${ICON.check}<span>Formel und Realität passen gut zusammen.</span></div>`}`
        : ad && ad.insufficient ? `<p class="small muted">Trage an mindestens 70 % der Tage alles ein, was du isst (aktuell ${ad.logged} von ${ad.span} Tagen). Dann berechnet Kalorio aus Gewichtstrend und Kalorien deinen echten Verbrauch.</p>`
        : `<p class="small muted">Nach ca. 2–4 Wochen mit Gewichtseinträgen und vollständigem Tagebuch berechnet Kalorio hier deinen echten Verbrauch – genauer als jede Formel.</p>`}
    </section>
  </div>`;
  bindSeg(v, "sr", (x) => { statRange = +x; render(); });
  v.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-adopt]"); if (!b) return;
    const tdee = +b.dataset.adopt;
    // PAL so anpassen, dass der berechnete Verbrauch dem gemessenen entspricht
    const p = { ...App.profile };
    const newPal = clamp((tdee - App.plan.sport - App.plan.pregnancyAdd) / App.plan.bmr, 1.1, 2.5);
    if (!(await confirmSheet("Verbrauch übernehmen?", `Kalorio setzt deine Alltagsaktivität auf PAL ${fmt(newPal, 2)}. Dein Verbrauch beträgt dann ca. ${fmt(tdee)} kcal und dein Ziel wird neu berechnet.`, "Übernehmen"))) return;
    p.pal = round(newPal, 3);
    await saveProfile(p); toast(`Neues Ziel: ${fmt(App.plan.target)} kcal`); render();
  });
}

async function exportFlow() {
  const json = await exportData();
  const name = `kalorio-sicherung-${dkey()}.json`;
  if (BUILD === "artifact" && window.claude && window.claude.use) {
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename: name, data: new Blob([json], { type: "application/json" }) }); toast("Sicherung bereit"); return; }
    } catch (e) { /* Fallback unten */ }
  }
  if (BUILD !== "artifact") {
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Sicherung heruntergeladen"); return;
    } catch (e) {}
  }
  const s = openSheet({ title: "Sicherung", body: `<div class="stack"><p class="small muted">Kopiere diesen Text und bewahre ihn auf (z. B. in einer Notiz). Zum Wiederherstellen fügst du ihn wieder ein.</p><textarea class="input" id="exp_t" rows="8" readonly style="font-family:var(--f-mono);font-size:12px">${esc(json)}</textarea></div>`, foot: `<button class="btn primary block" data-copy>${ICON.copy} Kopieren</button>` });
  $("[data-copy]", s.el).onclick = () => {
    const t = $("#exp_t", s.el);
    navigator.clipboard.writeText(json).then(() => toast("Kopiert"), () => { t.focus(); t.select(); toast("Text markiert – jetzt kopieren"); });
  };
}

function importFlow() {

  };
  $("[data-del]", s.el).onclick = async () => {
    const removed = await removeEntry(k, e.id); s.close(); render();
    toast("Eintrag gelöscht", { label: "Rückgängig", fn: async () => { getDay(k).entries.push(removed); await saveDay(k); render(); } });
  };
}

async function boot() {
  try {
    await Store.open();
    loadBuiltin();
    await loadAll();
  } catch (e) {
    console.error(e);
  }
  // Datum aktuell halten, wenn die App über Mitternacht offen bleibt
  let lastToday = dkey();
  setInterval(() => { const t = dkey(); if (t !== lastToday) { if (App.date === lastToday) App.date = t; lastToday = t; if (!sheets.length) render(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { const t = dkey(); if (t !== lastToday) { if (App.date === lastToday) App.date = t; lastToday = t; render(); } } });
  render();
  if (BUILD === "pwa" && "serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }
}
boot();

})();
</script>
