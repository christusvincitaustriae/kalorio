<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalorio</title>
<meta name="description" content="Kalorienzähler mit genauer Bedarfsberechnung, Barcode-Scanner und großer Lebensmitteldatenbank – alle Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#0E1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalorio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: eine schmale App-Spalte (max. 560px), feste Tab-Leiste unten, Sheets für Eingaben */
:root {
  --bg: #0E1116;
  --s1: #151A21;
  --s2: #1C222B;
  --s3: #252D38;
  --line: #2A323E;
  --fg: #EDEBE6;
  --fg2: #A9B0BC;
  --fg3: #707989;
  --accent: #FFA364;
  --accent-2: #FFC59C;
  --accent-ink: #2B1404;
  --pro: #A391FF;
  --carb: #F2C14E;
  --fat: #46C9B9;
  --good: #5DD39E;
  --bad: #FF7474;
  --warn: #F5B84B;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-s: 10px;
  --r-m: 16px;
  --r-l: 22px;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .tab { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--fg2); }
.faint { color: var(--fg3); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.label {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg3);
}
.hide { display: none !important; }

/* ---------- App-Shell ---------- */
#app {
  max-width: 560px; margin: 0 auto; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0 12px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
  display: grid; place-items: center; color: var(--accent-ink);
}
.brand-name { font-family: var(--f-display); font-weight: 750; font-size: 20px; letter-spacing: -0.02em; }
.view { display: flex; flex-direction: column; gap: 14px; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: color-mix(in srgb, var(--s1) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-inner { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.nav a {
  display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none;
  color: var(--fg3); font-size: 11px; font-weight: 600; padding: 6px 0;
}
.nav a svg { width: 23px; height: 23px; }
.nav a.on { color: var(--fg); }
.nav a.on svg { color: var(--accent); }
.nav .fab {
  justify-self: center; width: 54px; height: 54px; border-radius: 18px; border: 0;
  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  box-shadow: 0 6px 22px -6px color-mix(in srgb, var(--accent) 70%, transparent);
  transform: translateY(-10px);
}
.nav .fab svg { width: 26px; height: 26px; }

/* ---------- Bausteine ---------- */
.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; }
.card.tight { padding: 12px 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.s4 { gap: 4px; }
.stack.s6 { gap: 6px; }
.stack.s16 { gap: 16px; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--s2); color: var(--fg);
  border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; min-height: 42px;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--s3); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { background: var(--s2); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--s1);
  display: grid; place-items: center; color: var(--fg2); flex: none;
}
.icon-btn:hover { color: var(--fg); background: var(--s2); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.plain { border-color: transparent; background: transparent; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 11px;
  font-size: 13px; font-weight: 600; background: var(--s2); border: 1px solid var(--line); color: var(--fg2);
  white-space: nowrap;
}
button.chip:hover { color: var(--fg); }
.chip.on { background: color-mix(in srgb, var(--accent) 18%, var(--s2)); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }

.pill svg, .chip svg { width: 14px; height: 14px; flex: none; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 650; }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.neutral { background: var(--s2); color: var(--fg2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.badge-src { font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--s3); color: var(--fg2); flex: none; }
.badge-src.off { color: var(--fat); }
.badge-src.own { color: var(--accent); }
.badge-src.calc { color: var(--pro); }

/* Formulare */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.input, select.input, textarea.input {
  width: 100%; background: var(--s2); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; font-size: 16px; min-height: 46px; outline: none; transition: border-color .15s;
}
.input:focus { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .suffix { position: absolute; right: 12px; color: var(--fg3); font-size: 14px; pointer-events: none; }
.input-wrap .input { padding-right: 44px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--s2); border: 1px solid var(--line); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 6px; font-weight: 650; font-size: 14px; color: var(--fg2); }
.seg button.on { background: var(--s3); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.option {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  border: 1px solid var(--line); background: var(--s1); border-radius: 16px; padding: 13px 14px;
}
.option:hover { background: var(--s2); }
.option.on { border-color: color-mix(in srgb, var(--accent) 65%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--s1)); }
.option .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--fg3); flex: none; margin-top: 2px; display: grid; place-items: center; }
.option.on .radio { border-color: var(--accent); }
.option.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.option .o-t { font-weight: 650; }
.option .o-d { color: var(--fg2); font-size: 13px; margin-top: 2px; }
.option .o-r { margin-left: auto; text-align: right; flex: none; }

input[type=range] { width: 100%; accent-color: var(--accent); }

/* ---------- Heute ---------- */
.datebar { display: flex; align-items: center; gap: 6px; }
.datebar .d { font-family: var(--f-display); font-weight: 650; font-size: 16px; min-width: 0; text-align: center; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
@media (max-width: 400px) { .hero { grid-template-columns: 1fr; justify-items: center; } .hero .hero-stats { width: 100%; } }
.ring { position: relative; width: 168px; height: 168px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .big { font-family: var(--f-display); font-size: 36px; font-weight: 750; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ring .sub { font-size: 12px; color: var(--fg2); margin-top: 4px; }
.hero-stats { display: flex; flex-direction: column; gap: 10px; }
.kv { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kv .k { color: var(--fg2); font-size: 13.5px; }
.kv .v { font-weight: 650; font-variant-numeric: tabular-nums; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { min-width: 0; }
.macro .m-top { display: flex; flex-direction: column; gap: 1px; font-size: 13px; }
.macro .m-top b { font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 99px; background: var(--s3); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
.statusline { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--s2); }
.statusline svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }

.meal { padding: 0; overflow: hidden; }
.meal-h { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 16px; }
.meal-h .mk { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 650; }
.entry { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 16px; border-top: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.entry:hover { background: var(--s2); }
.entry .e-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .e-d { font-size: 12.5px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .e-k { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
.meal-add { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-top: 1px dashed var(--line); background: transparent; padding: 11px 16px; color: var(--accent); font-weight: 650; font-size: 14px; }
.meal-add:hover { background: var(--s2); }
.meal-add svg { width: 18px; height: 18px; }

.water { display: flex; gap: 5px; flex-wrap: wrap; }
.water button { width: 30px; height: 38px; border-radius: 8px 8px 11px 11px; border: 1px solid var(--line); background: var(--s2); padding: 0; position: relative; overflow: hidden; }
.water button.f { background: color-mix(in srgb, #5AB4FF 55%, var(--s2)); border-color: color-mix(in srgb, #5AB4FF 60%, var(--line)); }
.water button.plus { color: var(--fg3); display: grid; place-items: center; }

.burn-list { display: flex; flex-direction: column; }
.burn { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.burn:first-child { border-top: 0; }
.act-ic, .burn .b-ic { width: 38px; height: 38px; border-radius: 12px; background: var(--s2); display: grid; place-items: center; color: var(--accent); flex: none; }
.act-ic svg, .burn .b-ic svg { width: 21px; height: 21px; }
.burn .b-v { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; flex: none; }

/* ---------- Sheets & Dialoge ---------- */
.scrim { position: fixed; inset: 0; background: rgba(4, 6, 9, 0.62); z-index: 60; opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; margin: 0 auto; max-width: 600px;
  background: var(--s1); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0;
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.full { height: calc(100% - 28px - env(safe-area-inset-top, 0px)); }
.sheet.show { transform: translateY(0); }
.sheet-grab { width: 40px; height: 5px; border-radius: 9px; background: var(--s3); margin: 9px auto 2px; flex: none; }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; flex: none; }
.sheet-h h2 { flex: 1; min-width: 0; }
.sheet-b { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 20px; flex: 1; min-height: 0; }
.sheet-f { padding: 12px 16px 14px; border-top: 1px solid var(--line); flex: none; display: flex; gap: 10px; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .bar > i { transition: none; } }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .22s;
  background: var(--fg); color: var(--bg); font-weight: 650; font-size: 14px; padding: 10px 16px; border-radius: 14px;
  width: max-content; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center;
}
.toast.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%) translateY(-20px); }
.toast.top.show { transform: translateX(-50%) translateY(0); }
.toast { pointer-events: none; }
.toast button { pointer-events: auto; }
.toast span { min-width: 0; }
.toast button { flex: none; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast button { border: 0; background: transparent; color: #B4560F; font-weight: 750; padding: 0; }

/* Suche */
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--fg3); pointer-events: none; }
.search .input { padding-left: 42px; padding-right: 44px; }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.results { display: flex; flex-direction: column; }
.res { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; text-align: left; }
.res:hover { background: var(--s2); }
.res .r-n { font-weight: 600; line-height: 1.3; }
.res .r-b { font-size: 12.5px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res .r-k { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.res .r-k b { display: block; font-size: 15px; }
.res .r-k span { font-size: 11.5px; color: var(--fg3); }
.res .quick { width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--line); background: var(--s2); display: grid; place-items: center; color: var(--accent); flex: none; }
.res .quick svg { width: 18px; height: 18px; }
.empty { text-align: center; padding: 28px 12px; color: var(--fg2); }
.empty svg { width: 36px; height: 36px; color: var(--fg3); margin-bottom: 6px; }
.section-t { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 4px; }

/* Nährwerttabelle im Stil der Verpackungsangabe */
.label-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.label-table th { text-align: left; font-weight: 600; color: var(--fg2); font-size: 12px; padding: 0 0 6px; }
.label-table th:last-child, .label-table td:last-child { text-align: right; }
.label-table th:nth-child(2), .label-table td:nth-child(2) { text-align: right; }
.label-table td:first-child { white-space: nowrap; padding-right: 10px; }
.label-table td { padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.label-table tr.sub td:first-child { padding-left: 14px; color: var(--fg2); }
.label-table tr.strong td { font-weight: 700; border-top: 2px solid var(--fg3); }

.amount { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; }
.amount > * { min-width: 0; }
input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.stepper { display: flex; align-items: center; background: var(--s2); border: 1px solid var(--line); border-radius: 12px; min-height: 46px; }
.stepper button { width: 42px; height: 44px; border: 0; background: transparent; color: var(--fg2); font-size: 20px; flex: none; }
.stepper input { flex: 1; min-width: 0; text-align: center; border: 0; background: transparent; font-size: 17px; font-weight: 650; outline: none; padding: 0; }
.big-kcal { font-family: var(--f-display); font-size: 40px; font-weight: 750; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }

/* Wizard */
.wizard-prog { display: flex; gap: 5px; }
.wizard-prog i { flex: 1; height: 4px; border-radius: 9px; background: var(--s3); }
.wizard-prog i.on { background: var(--accent); }
.sport-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; background: var(--s2); border-radius: 14px; }
.sport-row .sr-d { font-size: 12.5px; color: var(--fg2); }

/* Ergebnis / Statistik */
.result-big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.result-big .n { font-family: var(--f-display); font-size: 52px; font-weight: 750; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.calc-steps { display: flex; flex-direction: column; }
.calc-steps .cs { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.calc-steps .cs:first-child { border-top: 0; }
.calc-steps .cs .v { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.calc-steps .cs.total { border-top: 2px solid var(--fg3); font-weight: 700; }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--fg2); }
.tips b { color: var(--fg); }
.note { padding: 12px 14px; border-radius: 14px; font-size: 13.5px; display: flex; gap: 10px; }
.note svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.note.warn { background: color-mix(in srgb, var(--warn) 12%, var(--s1)); color: color-mix(in srgb, var(--warn) 30%, var(--fg)); }
.note.bad { background: color-mix(in srgb, var(--bad) 12%, var(--s1)); color: color-mix(in srgb, var(--bad) 25%, var(--fg)); }
.note.info { background: var(--s2); color: var(--fg2); }
.chart { width: 100%; overflow: hidden; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--fg3); }
.stat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px; }
.tile .t-v { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .t-s { font-size: 12.5px; color: var(--fg2); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.scanner-box { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; max-width: 100%; }
.scanner-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-box .frame { position: absolute; left: 12%; right: 12%; top: 32%; bottom: 32%; border: 2px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scanner-box .laser { position: absolute; left: 14%; right: 14%; top: 50%; height: 2px; background: var(--accent); opacity: .8; animation: laser 1.6s ease-in-out infinite alternate; }
@keyframes laser { from { transform: translateY(-28px); } to { transform: translateY(28px); } }
@media (prefers-reduced-motion: reduce) { .scanner-box .laser { animation: none; } }
.kbd-hint { font-family: var(--f-mono); font-size: 11px; color: var(--fg3); }
.onb-hero { padding: 26px 4px 6px; display: flex; flex-direction: column; gap: 10px; }
.onb-hero h1 { font-size: 34px; line-height: 1.08; }
.feature-list { display: grid; gap: 10px; }
.feature { display: flex; gap: 12px; align-items: flex-start; }
.feature .f-ic { width: 36px; height: 36px; border-radius: 11px; background: var(--s2); display: grid; place-items: center; color: var(--accent); flex: none; }
.feature .f-ic svg { width: 19px; height: 19px; }
a { color: var(--accent); }

/* ===== Speicher: IndexedDB mit Fallback im Arbeitsspeicher ===== */
const DB_NAME = "kalorio";
const DB_VER = 1;
const STORES = ["kv", "days", "weights", "custom", "offcache"];
const Store = {
  db: null,
  mem: Object.fromEntries(STORES.map((s) => [s, new Map()])),
  persistent: false,
  async open() {
    try {
      if (!("indexedDB" in window)) throw new Error("no idb");
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = () => { const db = r.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error("blocked"));
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
      this.persistent = true;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    } catch (e) {
      console.warn("IndexedDB nicht verfügbar, Daten nur in dieser Sitzung", e);
      this.db = null;
    }
  },
  _tx(store, mode) { return this.db.transaction(store, mode).objectStore(store); },
  async get(store, key) {
    if (!this.db) return this.mem[store].get(key);
    try { return await new Promise((res, rej) => { const r = this._tx(store, "readonly").get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    catch (e) { return this.mem[store].get(key); }
  },
  async set(store, key, val) {
    this.mem[store].set(key, val);
    if (!this.db) return;
    try { await new Promise((res, rej) => { const r = this._tx(store, "readwrite").put(val, key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
    catch (e) { console.warn("Speichern fehlgeschlagen", e); }
  },
  async del(store, key) {
    this.mem[store].delete(key);
    if (!this.db) return;
    try { await new Promise((res, rej) => { const r = this._tx(store, "readwrite").delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); } catch (e) {}
  },
  async all(store) {
    if (!this.db) return Array.from(this.mem[store].entries());
    try {
      return await new Promise((res, rej) => {
        const out = []; const r = this._tx(store, "readonly").openCursor();
        r.onsuccess = () => { const c = r.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
        r.onerror = () => rej(r.error);
      });
    } catch (e) { return Array.from(this.mem[store].entries()); }
  },
  async clearAll() {
    for (const s of STORES) this.mem[s].clear();
    if (!this.db) return;
    for (const s of STORES) await new Promise((res) => { const r = this._tx(s, "readwrite").clear(); r.onsuccess = res; r.onerror = res; });
  },
};

const PACES = {

    { id: "gentle", t: "Sanft", pct: 0.25 },
    { id: "moderate", t: "Ausgewogen", pct: 0.5 },

const KCAL_PER_KG_LOSS = 7700;
const KCAL_PER_KG_GAIN = 7000;

function bmiCat(b) {
  if (b < 16) return { t: "Starkes Untergewicht", c: "bad" };
  if (b < 18.5) return { t: "Untergewicht", c: "warn" };
  if (b < 25) return { t: "Normalgewicht", c: "good" };
  if (b < 30) return { t: "Übergewicht", c: "warn" };
  if (b < 35) return { t: "Adipositas Grad I", c: "bad" };
  if (b < 40) return { t: "Adipositas Grad II", c: "bad" };
  return { t: "Adipositas Grad III", c: "bad" };
}

/* US-Navy-Formel (Hodgdon & Beckett), Maße in cm */
function navyBodyFat(sex, height, neck, waist, hip) {
  if (!height || !neck || !waist) return null;
  let bf;
  if (sex === "f") {
    if (!hip || waist + hip - neck <= 0) return null;
    bf = 495 / (1.29579 - 0.35004 * Math.log10(waist + hip - neck) + 0.221 * Math.log10(height)) - 450;
  } else {
    if (waist - neck <= 0) return null;
    bf = 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(height)) - 450;
  }
  return isFinite(bf) ? clamp(round(bf, 1), 3, 60) : null;
}

function calcSex(p) { return p.sex === "d" ? (p.formulaSex || "avg") : p.sex; }

function bmrMifflin(p) {
  const base = 10 * p.weight + 6.25 * p.height - 5 * p.age;
  const s = calcSex(p);
  return base + (s === "m" ? 5 : s === "f" ? -161 : -78);
}
function bmrKatch(p) {
  if (!p.bodyFat) return null;
  const lbm = p.weight * (1 - p.bodyFat / 100);
  return 370 + 21.6 * lbm;
}

function sportKcalPerDay(p, weight = p.weight) {
  let week = 0;
  for (const s of p.sports || []) {
    const sp = sportById(s.type);
    week += (sp.met - 1) * weight * (s.minutes / 60) * s.perWeek;
  }
  return week / 7;
}
function sportHoursPerDay(p) { return (p.sports || []).reduce((a, s) => a + (s.minutes / 60) * s.perWeek, 0) / 7; }

function computePlan(p) {
  const out = { warnings: [], notes: [] };
  const hM = p.height / 100;
  out.bmi = p.weight / (hM * hM);
  out.bmiCat = bmiCat(out.bmi);
  out.healthyMin = 18.5 * hM * hM;
  out.healthyMax = 24.9 * hM * hM;
  out.mifflin = bmrMifflin(p);
  out.katch = bmrKatch(p);
  const useKatch = p.formula === "katch" ? !!out.katch : p.formula === "mifflin" ? false : !!out.katch;
  out.bmr = useKatch ? out.katch : out.mifflin;
  out.bmrFormula = useKatch ? "Katch-McArdle" : "Mifflin-St Jeor";
  out.pal = p.pal || 1.45;
  out.everyday = out.bmr * out.pal;
  out.sport = sportKcalPerDay(p);
  out.pregnancyAdd = { t2: 250, t3: 500, bf: 500 }[p.pregnancy] || 0;
  out.tdee = out.everyday + out.sport + out.pregnancyAdd;

  // Ziel
  let goal = p.goal || "maintain";
  const pregnant = p.sex !== "m" && p.pregnancy && p.pregnancy !== "none";
  if (pregnant && goal === "lose") { goal = "maintain"; out.warnings.push({ c: "warn", t: "In Schwangerschaft und Stillzeit wird kein Kaloriendefizit berechnet. Bitte sprich Gewichtsziele mit deiner Ärztin oder Hebamme ab." }); }
  if (goal === "lose" && out.bmi < 18.5) { goal = "maintain"; out.warnings.push({ c: "bad", t: "Mit einem BMI unter 18,5 ist Abnehmen gesundheitlich nicht sinnvoll. Die App rechnet deshalb mit Gewicht halten. Lass dich bei Fragen ärztlich beraten." }); }
  out.goal = goal;
  const focus = p.focus || "simple";
  out.focus = focus;

  let kgWeek = 0; // negativ = Abnahme
  let target = out.tdee;
  if (goal === "lose") {
    const pace = PACES.lose.find((x) => x.id === p.pace) || PACES.lose[1];
    kgWeek = -Math.min(1.0, p.weight * pace.pct / 100);
    if (out.bmi < 21 && pace.pct > 0.5) {
      kgWeek = -p.weight * 0.005;
      out.warnings.push({ c: "warn", t: "Bei deinem schon niedrigen BMI begrenzt die App das Tempo auf 0,5 % des Körpergewichts pro Woche." });
    }
    target = out.tdee + kgWeek * KCAL_PER_KG_LOSS / 7;
  } else if (goal === "gain") {
    if (focus === "muscle") {
      const pace = PACES.gainMuscle.find((x) => x.id === p.pace) || PACES.gainMuscle[1];
      kgWeek = p.weight * pace.pm / 100 / 4.345;
    } else {
      const pace = PACES.gainSimple.find((x) => x.id === p.pace) || PACES.gainSimple[1];
      kgWeek = pace.kg;
    }
    target = out.tdee + kgWeek * KCAL_PER_KG_GAIN / 7;
  } else if (focus === "muscle") {
    target = out.tdee * (out.bmi > 25 ? 0.9 : 0.95); // Recomp: leichtes Defizit, viel Eiweiß
    kgWeek = (target - out.tdee) * 7 / KCAL_PER_KG_LOSS;
  }

  // Untergrenze: nie unter Grundumsatz und nicht unter 1.200 (Frauen) / 1.500 kcal (Männer)
  const s = calcSex(p);
  const absMin = s === "m" ? 1500 : s === "f" ? 1200 : 1350;
  out.floor = Math.max(absMin, out.bmr);
  out.limited = false;
  if (goal !== "gain" && target < out.floor && target < out.tdee) {
    target = Math.min(out.tdee, out.floor);
    kgWeek = (target - out.tdee) * 7 / KCAL_PER_KG_LOSS;
    out.limited = true;
    out.warnings.push({ c: "warn", t: `Das gewählte Tempo würde unter ${fmt(out.floor)} kcal führen (dein Grundumsatz bzw. die empfohlene Mindestmenge). Die App setzt dein Ziel deshalb auf diese Untergrenze.` });
  }
  if (p.age < 18) out.warnings.push({ c: "warn", t: "Die Formeln gelten für Erwachsene. Im Wachstum ist der Bedarf höher – Abnehmen bitte nur nach Rücksprache mit Kinderarzt oder Ernährungsberatung." });
  if (p.age >= 70) out.notes.push("Ab 70 Jahren verliert man leichter Muskulatur. Eiweiß und Krafttraining sind besonders wichtig.");

  out.target = Math.round(target / 10) * 10;
  out.delta = out.target - out.tdee;
  out.kgWeek = kgWeek;
  out.kgMonth = kgWeek * 4.345;

  // Makronährstoffe
  const ideal25 = 25 * hM * hM;
  out.refWeight = out.bmi > 30 ? ideal25 + 0.4 * (p.weight - ideal25) : p.weight; // angepasstes Körpergewicht
  const protFactor = { lose: focus === "muscle" ? 2.0 : 1.5, maintain: focus === "muscle" ? 2.0 : 1.4, gain: focus === "muscle" ? 1.8 : 1.5 }[goal];
  out.protFactor = protFactor;
  let protein = protFactor * out.refWeight;
  let fat = Math.max(0.28 * out.target / 9, 0.7 * out.refWeight);
  let carbs = (out.target - protein * 4 - fat * 9) / 4;
  if (carbs < 80) { // sehr niedriges Budget: Fett etwas senken, aber nicht unter 0,6 g/kg
    fat = Math.max(0.6 * out.refWeight, (out.target - protein * 4 - 80 * 4) / 9);
    carbs = Math.max(0, (out.target - protein * 4 - fat * 9) / 4);
  }
  out.protein = Math.round(protein);
  out.fat = Math.round(fat);
  out.carbs = Math.round(carbs);
  out.fiber = 30;
  out.sugarMax = Math.round(out.target * 0.1 / 4); // WHO: < 10 % der Energie aus freiem Zucker
  out.water = Math.round((clamp(p.weight * 32, 1500, 3500) + sportHoursPerDay(p) * 500) / 50) * 50;

  // Zeit bis zum Zielgewicht
  out.eta = null;
  if (p.targetWeight && kgWeek) {
    const diff = p.targetWeight - p.weight;
    if (Math.sign(diff) === Math.sign(kgWeek) && Math.abs(diff) > 0.05) {
      const weeks = Math.abs(diff / kgWeek);
      const d = new Date(); d.setDate(d.getDate() + Math.round(weeks * 7));
      out.eta = { weeks, date: d };
    }
  }
  if (p.targetWeight && p.targetWeight < out.healthyMin && goal === "lose") {
    out.warnings.push({ c: "bad", t: `Dein Zielgewicht liegt unter dem gesunden Bereich (BMI 18,5 = ${fmt(out.healthyMin, 1)} kg). Bitte wähle ein höheres Ziel.` });
  }
  return out;
}

const REST_MET = 1.5;
function exercisePlan(ex, kcal, kg) {
  if (ex.kind === "min") {
    const perMin = (ex.met - 1) * kg / 60;
    const min = Math.max(1, Math.ceil(kcal / perMin));
    return { min, kcal: Math.round(min * perMin), steps: ex.steps ? Math.round(min * ex.steps / 100) * 100 : null };
  }
  const work = ex.reps * ex.sec / 3600;
  const perSet = (ex.met - 1) * kg * work + (REST_MET - 1) * kg * (ex.rest / 3600);
  const sets = Math.max(1, Math.ceil(kcal / perSet));
  const min = Math.round((sets * (ex.reps * ex.sec + ex.rest)) / 60);
  return { sets, reps: ex.reps, total: sets * ex.reps, min, kcal: Math.round(sets * perSet), perRep: (ex.met - 1) * kg * ex.sec / 3600 };
}
function activityKcal(met, minutes, kg) { return Math.round((met - 1) * kg * minutes / 60); }
function stepsKcal(steps, kg) { return Math.round(steps * kg * 0.00042); } /* ca. 0,55 kcal/kg/km netto, 1 km ≈ 1.300 Schritte */

const Foods = {
  cats: [],
  list: [],          // alle durchsuchbaren Lebensmittel (eingebaut + eigene + gecachte Online-Produkte)
  byId: new Map(),
  byCode: new Map(),
  builtinCount: 0,
};

/* Eintrag: {id, n, b, cat, u, k, p, h, f, z, bs, po:[[label,g]], s, code} – Nährwerte pro 100 g bzw. 100 ml */
function prepFood(f) {
  f._s = norm(f.n + " " + (f.b || ""));
  f._n = norm(f.n);
  f._b = norm(f.b || "");
  f._w = f._s.split(" ");
  return f;
}

function loadBuiltin() {
  const raw = window.__FOODS__;
  Foods.cats = raw.cats.map((c) => ({ name: c[0], unit: c[1], dp: c[2] }));
  for (const r of raw.foods) {
    const cat = Foods.cats[r[2]];
    const f = prepFood({
      id: "b:" + fnv(r[0] + "|" + r[1]), n: r[0], b: r[1], cat: cat.name, u: cat.unit,
      k: r[3], p: r[4], h: r[5], f: r[6], z: r[7], bs: r[8],
      po: (r[9] && r[9].length ? r[9] : cat.dp) || [], s: r[10],
    });
    Foods.list.push(f);
    Foods.byId.set(f.id, f);
  }
  Foods.builtinCount = Foods.list.length;
}

function addFoodToIndex(f) {
  prepFood(f);
  const prev = Foods.byId.get(f.id);
  if (prev) { const i = Foods.list.indexOf(prev); if (i >= 0) Foods.list[i] = f; }
  else Foods.list.push(f);
  Foods.byId.set(f.id, f);
  if (f.code) Foods.byCode.set(String(f.code), f);
}
function removeFoodFromIndex(id) {
  const f = Foods.byId.get(id);
  if (!f) return;
  Foods.list.splice(Foods.list.indexOf(f), 1);
  Foods.byId.delete(id);

const SYN = new Map();
for (const g of SYN_GROUPS) for (const w of g) { const set = SYN.get(w) || new Set(); g.forEach((x) => x !== w && set.add(x)); SYN.set(w, set); }

function tokenAlternatives(tok) {
  const alts = [tok];
  const s = SYN.get(tok);
  if (s) alts.push(...s);
  if (tok.length > 4 && tok.endsWith("n")) alts.push(tok.slice(0, -1)); // Plural grob
  if (tok.length > 4 && tok.endsWith("en")) alts.push(tok.slice(0, -2));
  if (tok.length > 4 && tok.endsWith("s")) alts.push(tok.slice(0, -1));
  return alts;
}

function scoreToken(f, alts) {
  let best = 0;
  for (const a of alts) {
    if (a.includes(" ")) { if (f._s.includes(a)) best = Math.max(best, 7); continue; }
    for (let i = 0; i < f._w.length; i++) {
      const w = f._w[i];
      if (w === a) best = Math.max(best, i === 0 ? 12 : 9);
      else if (w.startsWith(a)) best = Math.max(best, i === 0 ? 9 : 6);
      else if (a.length >= 3 && w.includes(a)) best = Math.max(best, 4);
    }
    if (best < 9 && f._b && f._b.startsWith(a)) best = Math.max(best, 8);
  }
  return best;
}

function searchFoods(q, limit = 60) {
  const nq = norm(q);
  if (!nq) return [];
  const toks = nq.split(" ").filter(Boolean);
  const altList = toks.map(tokenAlternatives);
  const hasMit = toks.includes("mit");
  const hasLight = /\b(light|zero|0|zuckerfrei|sugarfree|ohne|max|diat)\b/.test(nq);
  const out = [];
  const usage = App.usage || {};
  for (const f of Foods.list) {
    let total = 0, ok = true;
    for (const alts of altList) {
      const s = scoreToken(f, alts);
      if (!s) { ok = false; break; }
      total += s;
    }
    if (!ok) continue;
    if (f._n === nq) total += 25;
    else if (f._n.startsWith(nq)) total += 12;
    else if (f._s.includes(nq)) total += 5;
    total -= Math.min(10, f._n.length / 9);       // kürzere, allgemeinere Namen zuerst
    if (!hasMit && / mit /.test(" " + f._n + " ")) total -= 3;   // Varianten nach dem Grundprodukt
    if (/\b(classic|original|klassik|klassiker)\b/.test(f._s)) total += 3;
    if (!hasLight && /\b(light|zero|0%|zuckerfrei|sugarfree|ohne zucker|max)\b/.test(f._s)) total -= 4;
    if (f.s === "B") total -= 4;                    // berechnete Kombis nach den Grundlebensmitteln
    if (f.s === "U") total += 6;                    // eigene Lebensmittel
    const u = usage[f.id] || 0;
    if (u) total += Math.min(14, 4 + u * 2);
    if (App.favs && App.favs.has(f.id)) total += 8;
    out.push([total, f]);
  }
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, limit).map((x) => x[1]);
}

/* ===== Open Food Facts (offene, kostenlose Produktdatenbank – kein Konto, kein API-Schlüssel) ===== */
const OFF = {
  enabled: BUILD !== "artifact",
  status: "unknown",          // unknown | ok | offline | blocked
  hits: [],                   // Zeitstempel der Such-Anfragen (Limit: 10/min laut OFF)
  cache: new Map(),
  FIELDS: "code,product_name,product_name_de,generic_name_de,brands,quantity,serving_size,serving_quantity,nutriments,categories_tags,product_quantity,product_quantity_unit",
};

function offToFood(p) {
  if (!p) return null;
  const n = p.nutriments || {};
  let kcal = n["energy-kcal_100g"];
  if (kcal == null && n["energy_100g"] != null) kcal = n["energy_100g"] / 4.184;
  if (kcal == null && n["energy-kj_100g"] != null) kcal = n["energy-kj_100g"] / 4.184;
  const name = (p.product_name_de || p.product_name || p.generic_name_de || "").trim();
  if (!name || kcal == null || isNaN(kcal)) return null;
  const brand = Array.isArray(p.brands) ? p.brands.join(", ") : String(p.brands || "").split(",")[0].trim();
  const q = String(p.quantity || "");
  const cats = (p.categories_tags || []).join(" ");
  const isLiquid = /\d\s*(ml|cl|l)\b/i.test(q) || /beverages|drinks|getranke|boissons|sodas|waters|juices/.test(cats) || p.product_quantity_unit === "ml";
  const u = isLiquid ? "ml" : "g";
  const po = [];
  const sq = parseFloat(p.serving_quantity);
  if (sq > 0 && sq < 3000) po.push([`1 Portion${p.serving_size ? " (" + String(p.serving_size).slice(0, 24) + ")" : ""}`, round(sq, 1)]);
  let pack = parseFloat(p.product_quantity);
  if (!(pack > 0)) {
    const m = q.match(/([\d.,]+)\s*(kg|g|ml|cl|l)\b/i);
    if (m) { const v = parseFloat(m[1].replace(",", ".")); const unit = m[2].toLowerCase(); pack = unit === "kg" || unit === "l" ? v * 1000 : unit === "cl" ? v * 10 : v; }
  }
  if (pack > 0 && pack <= 5000 && (!sq || Math.abs(pack - sq) > 1)) po.push([`1 Packung (${fmt(pack)} ${u})`, round(pack, 1)]);
  const g = (k) => { const v = n[k]; return v == null || v === "" ? null : round(parseFloat(v), 1); };
  return {
    id: "o:" + p.code, code: String(p.code), n: name, b: brand, cat: "Online-Produkte", u,
    k: round(kcal, 1), p: g("proteins_100g") ?? 0, h: g("carbohydrates_100g") ?? 0, f: g("fat_100g") ?? 0,
    z: g("sugars_100g"), bs: g("fiber_100g"), po, s: "O",
  };
}

async function offFetch(url, ms = 9000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal, headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    OFF.status = "ok";
    return await r.json();
  } catch (e) {
    OFF.status = navigator.onLine === false ? "offline" : (e.name === "AbortError" ? "slow" : "blocked");
    throw e;
  } finally { clearTimeout(t); }
}

async function offProduct(code) {
  if (!OFF.enabled) return null;
  const j = await offFetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF.FIELDS}`);
  if (!j || j.status !== 1) return null;
  return offToFood(j.product);
}

function offCanSearch() {
  const now = Date.now();
  OFF.hits = OFF.hits.filter((t) => now - t < 60000);
  return OFF.hits.length < 9;
}
async function offSearch(q) {
  if (!OFF.enabled) return [];
  const key = norm(q);
  if (OFF.cache.has(key)) return OFF.cache.get(key);
  if (!offCanSearch()) throw new Error("ratelimit");
  OFF.hits.push(Date.now());
  const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=40&sort_by=unique_scans_n&lc=de&fields=${OFF.FIELDS}`;
  const j = await offFetch(url, 12000);
  const res = (j.products || []).map(offToFood).filter(Boolean);
  // Dubletten (gleicher Name + Marke) zusammenfassen
  const seen = new Set();
  const out = res.filter((f) => { const k = norm(f.n + "|" + f.b); if (seen.has(k)) return false; seen.add(k); return true; });
  OFF.cache.set(key, out);
  return out;
}

/* ===== Barcode-Scanner: native BarcodeDetector, sonst ZXing (wird bei Bedarf vom CDN geladen) ===== */
const ZXING_URLS = [
  "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js",
  "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js",
  "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js",
  "https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js",
];
let zxingPromise = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (zxingPromise) return zxingPromise;
  zxingPromise = (async () => {
    for (const url of ZXING_URLS) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = url; s.async = true; s.crossOrigin = "anonymous";
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
          setTimeout(() => rej(new Error("timeout")), 12000);
        });
        if (window.ZXing) return window.ZXing;
      } catch (e) {}
    }
    zxingPromise = null;
    throw new Error("Barcode-Bibliothek konnte nicht geladen werden");
  })();
  return zxingPromise;
}
const BC_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf"];
async function nativeDetector() {
  if (!("BarcodeDetector" in window)) return null;
  try {
    const sup = await window.BarcodeDetector.getSupportedFormats();
    const f = BC_FORMATS.filter((x) => sup.includes(x));
    if (!f.length) return null;
    return new window.BarcodeDetector({ formats: f });
  } catch (e) { return null; }
}
function zxingHints(Z) {
  const hints = new Map();
  const F = Z.BarcodeFormat;
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  return hints;
}
function validEAN(code) {
  if (!/^\d{8}$|^\d{12,14}$/.test(code)) return /^\d{6,14}$/.test(code);
  const d = code.split("").map(Number); const check = d.pop();
  let sum = 0; d.reverse().forEach((v, i) => { sum += v * (i % 2 === 0 ? 3 : 1); });
  return (10 - (sum % 10)) % 10 === check;
}

const Scanner = {
  stream: null, raf: null, reader: null, active: false,
  async start(video, onCode, onError) {
    this.stop();
    this.active = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onError("nocam"); return; }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) { onError(e && e.name === "NotAllowedError" ? "denied" : "nocam"); return; }
    if (!this.active) { this.stop(); return; }
    video.srcObject = this.stream;
    video.setAttribute("playsinline", ""); video.muted = true;
    try { await video.play(); } catch (e) {}
    const det = await nativeDetector();
    let last = "", count = 0;
    const accept = (code) => {
      if (!code) return;
      if (code === last) count++; else { last = code; count = 1; }
      if (count >= 2 && validEAN(code)) { if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} this.stop(); onCode(code); }
    };
    if (det) {
      const loop = async () => {
        if (!this.active) return;
        try { if (video.readyState >= 2) { const r = await det.detect(video); if (r && r[0]) accept(r[0].rawValue); } } catch (e) {}
        this.raf = setTimeout(loop, 160);
      };
      loop();
      return;
    }
    try {
      const Z = await loadZXing();
      if (!this.active) return;
      this.reader = new Z.BrowserMultiFormatReader(zxingHints(Z), 200);
      const cb = (res) => { if (res && this.active) accept(res.getText ? res.getText() : res.text); };
      if (this.reader.decodeFromStream) this.reader.decodeFromStream(this.stream, video, cb);
      else this.reader.decodeFromVideoElementContinuously(video, cb);
    } catch (e) { onError("nolib"); }
  },
  stop() {
    this.active = false;
    if (this.raf) { clearTimeout(this.raf); this.raf = null; }
    if (this.reader) { try { this.reader.reset(); } catch (e) {} this.reader = null; }
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
  },
  async fromImage(file) {
    const det = await nativeDetector();
    if (det) {
      try {
        const bmp = await createImageBitmap(file);
        const r = await det.detect(bmp);
        if (r && r[0]) return r[0].rawValue;
      } catch (e) {}
    }
    const Z = await loadZXing();
    const reader = new Z.BrowserMultiFormatReader(zxingHints(Z));
    const url = URL.createObjectURL(file);
    try { const res = await reader.decodeFromImageUrl(url); return res.getText(); }
    finally { URL.revokeObjectURL(url); try { reader.reset(); } catch (e) {} }
  },
};

function getDay(k) {
  let d = App.days.get(k);

  return d;
}
async function saveDay(k) {

  await Store.set("days", k, d);
}

function dayTotals(k) {
  const d = App.days.get(k);
  const t = { k: 0, p: 0, h: 0, f: 0, z: 0, bs: 0, meals: [0, 0, 0, 0], act: 0 };
  if (!d) return t;
  for (const e of d.entries) {
    t.k += e.k; t.p += e.p; t.h += e.h; t.f += e.f; t.z += e.z || 0; t.bs += e.bs || 0;
    t.meals[e.meal] += e.k;
  }
  for (const a of d.acts || []) t.act += a.kcal;
  return t;
}

  if (!App.plan) return null;

  const budget = App.plan.target + credit;
  const burned = App.plan.tdee + t.act;  // geschätzter Gesamtverbrauch des Tages
  return { budget, credit, burned, eaten: t.k, left: budget - t.k, balance: t.k - burned, totals: t };
}

  else { App.weights.set(k, kg); await Store.set("weights", k, kg); }

}

/* Trendgewicht: exponentiell geglättet (Hacker's-Diet-Prinzip, 10 %) über Kalendertage */
function trendSeries() {
  const s = weightSeries();
  if (!s.length) return [];
  const out = [];
  let trend = s[0][1];
  let prevKey = s[0][0];
  for (const [k, v] of s) {
    const gap = Math.max(1, ddiff(prevKey, k));
    const a = 1 - Math.pow(0.9, gap);
    trend = trend + a * (v - trend);
    out.push([k, v, trend]);
    prevKey = k;
  }
  return out;
}

/* Tatsächlicher Verbrauch aus Gewichtsverlauf + gegessenen Kalorien (mind. 14 Tage Daten) */
function adaptiveTDEE() {
  const tr = trendSeries();
  if (tr.length < 4) return null;
  const end = tr[tr.length - 1];
  const startIdx = tr.findIndex((x) => ddiff(x[0], end[0]) <= 28);
  const start = tr[startIdx];
  const span = ddiff(start[0], end[0]);
  if (span < 14) return null;
  let sum = 0, n = 0;
  for (let i = 0; i < span; i++) {
    const k = daddKey(start[0], i);
    const d = App.days.get(k);
    if (d && d.entries.length) { const t = dayTotals(k); if (t.k > 500) { sum += t.k; n++; } }
  }
  if (n < span * 0.7) return { insufficient: true, logged: n, span };
  const avgIn = sum / n;
  const dKg = end[2] - start[2];
  const tdee = avgIn - (dKg * KCAL_PER_KG_LOSS) / span;
  return { tdee: Math.round(tdee / 10) * 10, avgIn, dKg, span, logged: n };
}

/* ===== UI-Grundlagen: Sheets, Toasts, Bestätigungen, Routing ===== */
const sheets = [];
function openSheet({ title, body, foot, full = false, onClose, cls = "" }) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const el = document.createElement("section");
  el.className = "sheet " + (full ? "full " : "") + cls;
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  el.innerHTML = `<div class="sheet-grab"></div>
    <div class="sheet-h"><h2>${title || ""}</h2><button class="icon-btn plain" data-close aria-label="Schließen">${ICON.close}</button></div>
    <div class="sheet-b"></div>${foot ? '<div class="sheet-f"></div>' : ""}`;
  const b = $(".sheet-b", el);
  if (typeof body === "string") b.innerHTML = body; else if (body) b.appendChild(body);
  if (foot) { const f = $(".sheet-f", el); if (typeof foot === "string") f.innerHTML = foot; else f.appendChild(foot); }
  document.body.appendChild(scrim);
  document.body.appendChild(el);
  const api = {
    el, body: b, foot: $(".sheet-f", el),
    setTitle(t) { $(".sheet-h h2", el).innerHTML = t; },
    close() {
      if (api.closed) return; api.closed = true;
      el.classList.remove("show"); scrim.classList.remove("show");
      const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
      setTimeout(() => { el.remove(); scrim.remove(); }, 260);
      if (onClose) onClose();
      if (!sheets.length) document.body.style.overflow = "";
    },
  };
  scrim.addEventListener("click", () => api.close());
  $("[data-close]", el).addEventListener("click", () => api.close());
  sheets.push(api);
  document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { scrim.classList.add("show"); el.classList.add("show"); });
  return api;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheets.length) sheets[sheets.length - 1].close(); });

let toastTimer = null;
function toast(msg, action) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.innerHTML = `<span>${msg}</span>${action ? `<button>${action.label}</button>` : ""}`;
  if (action) $("button", t).onclick = () => { t.classList.remove("show"); action.fn(); };
  t.classList.toggle("top", sheets.length > 0);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), action ? 5000 : 2400);
}

function confirmSheet(title, text, okLabel = "Bestätigen", danger = false) {
  return new Promise((resolve) => {
    let done = false;
    const s = openSheet({
      title, body: `<p class="muted">${text}</p>`,
      foot: `<button class="btn grow" data-no>Abbrechen</button><button class="btn grow ${danger ? "danger" : "primary"}" data-ok>${okLabel}</button>`,
      onClose: () => { if (!done) resolve(false); },
    });
    $("[data-no]", s.el).onclick = () => { s.close(); };
    $("[data-ok]", s.el).onclick = () => { done = true; resolve(true); s.close(); };
  });
}

/* Hash-Routing: #heute, #gewicht, #statistik, #profil */
const ROUTES = ["heute", "gewicht", "statistik", "profil"];
function currentRoute() { const h = (location.hash || "").replace("#", ""); return ROUTES.includes(h) ? h : "heute"; }
function go(r) { if (location.hash !== "#" + r) location.hash = r; else render(); }
window.addEventListener("hashchange", () => { while (sheets.length) sheets[sheets.length - 1].close(); render(); });

function renderNav() {
  const r = currentRoute();
  const a = (id, ic, label) => `<a href="#${id}" class="${r === id ? "on" : ""}" aria-current="${r === id ? "page" : "false"}">${ICON[ic]}<span>${label}</span></a>`;

  if (!App.profile) { $("#nav").classList.add("hide"); renderOnboarding(); return; }

/* Kleine Formular-Helfer */
function seg(name, options, value) {
  return `<div class="seg" role="radiogroup" data-seg="${name}">${options.map(([v, l]) => `<button type="button" role="radio" aria-checked="${String(v) === String(value)}" class="${String(v) === String(value) ? "on" : ""}" data-v="${v}">${l}</button>`).join("")}</div>`;
}
function bindSeg(root, name, cb) {
  const el = $(`[data-seg="${name}"]`, root);
  if (!el) return;
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    $$("button", el).forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    cb(b.dataset.v);
  });
}
function numField(id, label, value, suffix, attrs = "") {
  return `<label class="field"><span>${label}</span><div class="input-wrap"><input class="input" id="${id}" inputmode="decimal" autocomplete="off" value="${value ?? ""}" ${attrs}>${suffix ? `<span class="suffix">${suffix}</span>` : ""}</div></label>`;
}
function readNum(id) { const el = document.getElementById(id); if (!el) return NaN; return parseNum(el.value); }

function macroBar(label, val, goal, color) {
  const pct = goal ? clamp((val / goal) * 100, 0, 100) : 0;
  return `<div class="macro"><div class="m-top"><span class="muted">${label}</span><b>${fmt(val)}<span class="faint"> / ${fmt(goal)} g</span></b></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}

function ringSVG(frac, over) {
  const r = 70, c = 2 * Math.PI * r;
  const f = clamp(frac, 0, 1);
  const over2 = over ? clamp(frac - 1, 0, 1) : 0;
  return `<svg viewBox="0 0 168 168" aria-hidden="true">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--s3)" stroke-width="13"/>
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" style="transition:stroke-dasharray .5s"/>
    ${over2 > 0 ? `<circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--bad)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${c * over2} ${c}"/>` : ""}
  </svg>`;
}

  const nav = s === 0 ? "" : `<div class="row" style="margin-top:6px">
      <button class="btn grow" data-back>${s === 1 && WZ.editing ? "Abbrechen" : "Zurück"}</button>
      <button class="btn primary grow" data-next>${s === 5 ? (WZ.editing ? "Plan übernehmen" : "Plan starten") : "Weiter"}</button></div>`;
  v.innerHTML = `${s > 0 ? `<div class="wizard-prog" style="margin:14px 0 4px">${prog}</div>` : ""}<div class="view">${html}${nav}</div>`;
  bindWizard(v);
}

  return `
  <div class="card stack">
    <span class="label">Tägliches Kalorienziel</span>
    <div class="result-big"><span class="n">${fmt(pl.target)}</span><span class="muted">kcal / Tag</span></div>
    <div class="row wrap">
      <span class="pill ${pl.delta < 0 ? "good" : pl.delta > 0 ? "warn" : "neutral"}">${goalWord} ${fmtSigned(pl.delta)} kcal</span>
      ${pl.kgWeek ? `<span class="pill neutral">${fmtSigned(pl.kgWeek, 2)} kg / Woche</span>` : ""}
      ${pl.eta ? `<span class="pill neutral">${ICON.clock} Ziel ca. ${dlong(pl.eta.date)}</span>` : ""}
    </div>
  </div>
  ${pl.warnings.map((w) => `<div class="note ${w.c}">${ICON.warn}<span>${w.t}</span></div>`).join("")}
  <div class="card">
    <div class="card-h"><h3>So wird gerechnet</h3></div>
    <div class="calc-steps">
      <div class="cs"><span>Grundumsatz <span class="faint">(${pl.bmrFormula})</span></span><span class="v">${fmt(pl.bmr)} kcal</span></div>
      <div class="cs"><span>× Alltagsaktivität <span class="faint">(PAL ${fmt(pl.pal, 2)})</span></span><span class="v">${fmt(pl.everyday)} kcal</span></div>
      <div class="cs"><span>+ Sport <span class="faint">(Ø pro Tag)</span></span><span class="v">${fmt(pl.sport)} kcal</span></div>
      ${pl.pregnancyAdd ? `<div class="cs"><span>+ Schwangerschaft/Stillzeit</span><span class="v">${fmt(pl.pregnancyAdd)} kcal</span></div>` : ""}
      <div class="cs total"><span>= Gesamtverbrauch</span><span class="v">${fmt(pl.tdee)} kcal</span></div>
      <div class="cs"><span>${pl.delta <= 0 ? "−" : "+"} ${goalWord}</span><span class="v">${fmt(Math.abs(pl.delta))} kcal</span></div>
      <div class="cs total"><span>= Dein Ziel</span><span class="v">${fmt(pl.target)} kcal</span></div>
    </div>
    ${pl.katch && pl.bmrFormula !== "Katch-McArdle" ? "" : pl.katch ? `<p class="xs faint" style="margin-top:8px">Zum Vergleich Mifflin-St Jeor: ${fmt(pl.mifflin)} kcal.</p>` : ""}
    <p class="xs faint" style="margin-top:8px">Untergrenze für dich: ${fmt(pl.floor)} kcal (Grundumsatz bzw. Mindestzufuhr).</p>
  </div>
  <div class="card stack">
    <h3>Nährstoffe pro Tag</h3>
    <div class="grid3">
      <div class="tile"><span class="label" style="color:var(--pro)">Eiweiß</span><div class="t-v">${pl.protein} g</div><div class="t-s">${fmt(pl.protFactor, 1)} g/kg · ${macroPct(pl.protein, 4)} %</div></div>
      <div class="tile"><span class="label" style="color:var(--carb)">Kohlenhydr.</span><div class="t-v">${pl.carbs} g</div><div class="t-s">${macroPct(pl.carbs, 4)} %</div></div>
      <div class="tile"><span class="label" style="color:var(--fat)">Fett</span><div class="t-v">${pl.fat} g</div><div class="t-s">${macroPct(pl.fat, 9)} %</div></div>
    </div>
    <div class="row wrap small muted"><span>Ballaststoffe ≥ ${pl.fiber} g</span><span>·</span><span>Zugesetzter Zucker &lt; ${pl.sugarMax} g</span><span>·</span><span>Trinken ≈ ${fmt(pl.water / 1000, 1)} l</span></div>
    ${pl.bmi > 30 ? `<p class="xs faint">Eiweiß ist auf ein angepasstes Körpergewicht von ${fmt(pl.refWeight, 1)} kg bezogen, weil Fettgewebe kaum Eiweiß braucht.</p>` : ""}
  </div>
  <div class="card">
    <div class="row between"><span class="muted">BMI</span><span class="row"><b class="num">${fmt(pl.bmi, 1)}</b><span class="pill ${pl.bmiCat.c}">${pl.bmiCat.t}</span></span></div>
    <p class="xs faint" style="margin-top:6px">Der BMI unterscheidet nicht zwischen Muskeln und Fett und ist bei sehr sportlichen Menschen wenig aussagekräftig.</p>
  </div>
  <div class="card stack">
    <h3>So erreichst du dein Ziel</h3>
    <ul class="tips">${planTips(pl, d).map((t) => `<li>${t}</li>`).join("")}</ul>
    ${pl.notes.map((n) => `<div class="note info">${ICON.info}<span>${n}</span></div>`).join("")}

function readStep(v) {
  const d = WZ.d, s = WZ.step;
  if (s === 1) {
    const age = readNum("w_age"), h = readNum("w_h"), w = readNum("w_w");
    if (!(age >= 14 && age <= 100)) return "Bitte gib ein Alter zwischen 14 und 100 Jahren an.";
    if (!(h >= 120 && h <= 230)) return "Bitte gib deine Größe in cm an (120–230).";
    if (!(w >= 30 && w <= 300)) return "Bitte gib dein Gewicht in kg an (30–300).";
    d.age = Math.round(age); d.height = h; d.weight = w;
    if (d.sex === "m") d.pregnancy = "none"; else d.pregnancy = $("#w_preg").value;
    if (d.bfMode === "known") { const bf = readNum("w_bf"); if (!(bf >= 3 && bf <= 60)) return "Körperfett bitte zwischen 3 und 60 % angeben – oder „Weiß ich nicht“ wählen."; d.bodyFat = bf; }
    if (d.bfMode === "navy") {
      d.neck = readNum("w_neck"); d.waist = readNum("w_waist"); d.hip = d.sex !== "m" ? readNum("w_hip") : null;
      const bf = navyBodyFat(d.sex === "d" ? (d.formulaSex === "f" ? "f" : "m") : d.sex, d.height, d.neck, d.waist, d.hip);
      if (!bf) return "Die Maße ergeben keinen gültigen Wert. Prüfe Hals, Taille" + (d.sex !== "m" ? " und Hüfte" : "") + ".";
      d.bodyFat = bf;
    }
    if (d.bfMode === "none") d.bodyFat = null;
  }
  if (s === 4) {
    const tw = $("#w_tw") ? readNum("w_tw") : NaN;
    d.targetWeight = tw >= 30 && tw <= 300 ? tw : null;
    if (d.targetWeight && d.goal === "lose" && d.targetWeight >= d.weight) return "Dein Zielgewicht liegt über deinem aktuellen Gewicht – wähle „Zunehmen“ oder ein niedrigeres Ziel.";
    if (d.targetWeight && d.goal === "gain" && d.targetWeight <= d.weight) return "Dein Zielgewicht liegt unter deinem aktuellen Gewicht – wähle „Abnehmen“ oder ein höheres Ziel.";
  }
  return null;
}

function bindWizard(v) {
  const d = WZ.d;
  const rer = () => { const y = window.scrollY; renderWizard(); window.scrollTo(0, y); };
  const keepInputs = () => { if (WZ.step === 1) { ["w_age", "w_h", "w_w"].forEach((id, i) => { const x = readNum(id); if (!isNaN(x)) d[["age", "height", "weight"][i]] = x; }); const p = $("#w_preg"); if (p) d.pregnancy = p.value; } if (WZ.step === 4 && $("#w_tw")) { const x = readNum("w_tw"); d.targetWeight = isNaN(x) ? null : x; } };
  bindSeg(v, "sex", (x) => { keepInputs(); d.sex = x; rer(); });
  bindSeg(v, "fsex", (x) => { d.formulaSex = x; });
  bindSeg(v, "bf", (x) => { keepInputs(); d.bfMode = x; rer(); });
  bindSeg(v, "exp", (x) => { d.experience = x; d.pace = { beginner: "fast", intermediate: "moderate", advanced: "gentle" }[x]; keepInputs(); rer(); });
  const navyOut = () => {
    const o = $("#navy_out"); if (!o) return;
    const bf = navyBodyFat(d.sex === "d" ? (d.formulaSex === "f" ? "f" : "m") : d.sex, readNum("w_h"), readNum("w_neck"), readNum("w_waist"), $("#w_hip") ? readNum("w_hip") : null);
    o.innerHTML = bf ? `Geschätzter Körperfettanteil: <b>${fmt(bf, 1)} %</b>` : "";
  };
  $$("#w_neck,#w_waist,#w_hip,#w_h", v).forEach((el) => el.addEventListener("input", navyOut));
  navyOut();
  v.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.pal) { d.pal = +t.dataset.pal; $$("[data-pal]", v).forEach((x) => x.classList.toggle("on", x === t)); return; }
    if (t.dataset.goal) { keepInputs(); d.goal = t.dataset.goal; if (d.goal === "gain" && d.focus === "muscle") d.pace = { beginner: "fast", intermediate: "moderate", advanced: "gentle" }[d.experience]; else d.pace = "moderate"; rer(); return; }
    if (t.dataset.focus) { keepInputs(); d.focus = t.dataset.focus; if (d.goal === "gain" && d.focus === "muscle") d.pace = { beginner: "fast", intermediate: "moderate", advanced: "gentle" }[d.experience]; else if (d.goal !== "lose") d.pace = "moderate"; rer(); return; }
    if (t.dataset.pace) { keepInputs(); d.pace = t.dataset.pace; rer(); return; }
    if (t.hasAttribute("data-addsport")) {
      const pw = readNum("sp_pw"), mn = readNum("sp_min");
      if (!(pw > 0 && pw <= 21) || !(mn > 0 && mn <= 600)) { toast("Bitte Einheiten (1–21) und Minuten angeben"); return; }
      d.sports.push({ type: $("#sp_type").value, perWeek: pw, minutes: Math.round(mn) });
      rer(); return;
    }
    if (t.dataset.rmsport != null) { d.sports.splice(+t.dataset.rmsport, 1); rer(); return; }
    if (t.hasAttribute("data-import")) { importFlow(); return; }
    if (t.hasAttribute("data-back")) {
      if (WZ.step === 1 && WZ.editing) { WZ = null; render(); return; }
      keepInputs(); WZ.step = Math.max(0, WZ.step - 1); renderWizard(); window.scrollTo(0, 0); return;
    }
    if (t.hasAttribute("data-next")) {
      const err = readStep(v);
      if (err) { toast(err); return; }
      if (WZ.step < 5) { WZ.step++; renderWizard(); window.scrollTo(0, 0); return; }
      // speichern
      const p = { ...d };
      const plan = draftPlan(d);
      p.bodyFat = d.bfMode === "none" ? null : d.bodyFat;
      p.goal = plan.goal;
      p.updatedAt = Date.now();
      if (!App.profile) { p.createdAt = Date.now(); p.startWeight = d.weight; }
      else { p.createdAt = App.profile.createdAt; p.startWeight = App.profile.startWeight ?? d.weight; }
      const wasEditing = WZ.editing;
      await saveProfile(p);
      const today = dkey();
      if (!wasEditing || Math.abs((latestWeight() || 0) - d.weight) > 0.01) await setWeight(today, d.weight);
      WZ = null;
      toast(wasEditing ? "Plan aktualisiert" : "Plan gespeichert – los geht's!");
      location.hash = "heute"; render(); window.scrollTo(0, 0);
    }
  });
}

/* ===== Ansicht: Heute ===== */
let burnTarget = null;
let burnUser = false;
let burnAll = false;

function renderToday(v) {
  const k = App.date;
  const pl = App.plan;
  const B = dayBudget(k);
  const t = B.totals;
  const d = getDay(k);
  const frac = B.budget ? B.eaten / B.budget : 0;
  const left = B.left;
  const over = left < 0;
  const isToday = k === dkey();
  const isPast = k < dkey();

  // Statusmeldung
  let st;
  const bal = B.balance; // gegessen − Verbrauch
  if (!d.entries.length) {
    st = { c: "neutral", ic: "info", t: isPast ? "An diesem Tag wurde nichts eingetragen." : `Noch nichts eingetragen. Dein Budget ${isToday ? "heute" : "an diesem Tag"}: <b>${fmt(B.budget)} kcal</b>.` };
  } else if (pl.goal === "lose") {
    const proj = B.budget - B.burned; // Bilanz, wenn das Budget genau ausgeschöpft wird
    if (isPast) {
      if (bal < 0 && !over) st = { c: "good", ic: "check", t: `Ziel erreicht: <b>${fmt(-bal)} kcal Defizit</b> – das entspricht etwa ${fmt(-bal / 7.7)} g Körperfett.` };
      else if (bal < 0) st = { c: "warn", ic: "warn", t: `${fmt(-left)} kcal über dem Ziel, aber trotzdem <b>${fmt(-bal)} kcal Defizit</b> (≈ ${fmt(-bal / 7.7)} g Fett).` };
      else st = { c: "bad", ic: "trendUp", t: `<b>Überschuss von ${fmt(bal)} kcal</b> an diesem Tag. Ein einzelner Tag ist kein Problem – entscheidend ist der Wochenschnitt.` };
    } else if (!over) st = { c: "good", ic: "check", t: `Im Plan. Bleibst du bei ${fmt(B.budget)} kcal, hast du ${isToday ? "heute" : "an diesem Tag"} ein <b>Defizit von ca. ${fmt(-proj)} kcal</b> (≈ ${fmt(-proj / 7.7)} g Fett).` };
    else if (bal < 0) st = { c: "warn", ic: "warn", t: `${fmt(-left)} kcal über deinem Ziel, aber noch <b>${fmt(-bal)} kcal unter</b> deinem Verbrauch. Du nimmst nicht zu, verlierst aber weniger. Der Bonus-Burner unten zeigt, wie du es ausgleichst.` };
    else st = { c: "bad", ic: "trendUp", t: `<b>Überschuss von ${fmt(bal)} kcal</b> gegenüber deinem Verbrauch. Gleiche ihn mit Bewegung (siehe unten) oder in den nächsten Tagen etwas aus – ein einzelner Tag ist kein Problem.` };
  } else if (pl.goal === "gain") {
    if (left > 150) st = { c: "warn", ic: "info", t: isPast ? `${fmt(left)} kcal unter deinem Aufbauziel. ${bal < 0 ? `Bilanz: ${fmtSigned(bal)} kcal – an diesem Tag gab es keinen Überschuss.` : `Überschuss: ${fmt(bal)} kcal.`}` : `Noch <b>${fmt(left)} kcal</b> bis zu deinem Aufbauziel (Überschuss von ca. ${fmt(B.budget - B.burned)} kcal).` };
    else if (left >= -200) st = { c: "good", ic: "check", t: `Ziel erreicht – Überschuss von <b>${fmt(bal)} kcal</b> für deinen Aufbau.` };
    else st = { c: "warn", ic: "warn", t: `${fmt(-left)} kcal über deinem Ziel. Ein höherer Überschuss baut kaum mehr Muskeln auf, sondern vor allem Fett.` };
  } else {
    if (Math.abs(left) <= 150) st = { c: "good", ic: "check", t: `Punktlandung – du liegst im Bereich deines Bedarfs (${fmtSigned(bal)} kcal).` };
    else if (left > 0) st = { c: "neutral", ic: "info", t: `Noch <b>${fmt(left)} kcal</b> bis zu deinem Tagesbedarf.` };
    else st = { c: "warn", ic: "warn", t: `<b>${fmt(-left)} kcal über</b> deinem Bedarf. Bilanz: ${fmtSigned(bal)} kcal.` };
  }
  const stColor = { good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)", neutral: "var(--fg2)" }[st.c];

  const yesterday = App.days.get(daddKey(k, -1));
  const mealCard = (mi) => {
    const items = d.entries.filter((e) => e.meal === mi);
    const canCopy = !items.length && yesterday && yesterday.entries.some((e) => e.meal === mi);
    return `<section class="card meal">
      <div class="meal-h"><h3>${MEALS[mi]}</h3>${canCopy ? `<button class="chip" data-copymeal="${mi}" title="Von gestern übernehmen">${ICON.copy} Wie gestern</button>` : ""}<span class="mk">${items.length ? fmt(t.meals[mi]) + " kcal" : ""}</span></div>
      ${items.map((e) => `<button class="entry" data-entry="${e.id}"><div class="grow"><div class="e-n">${esc(e.n)}</div><div class="e-d num">${e.qty && e.label ? `${fmt(e.qty, 2)} × ${esc(e.label)} · ` : ""}${fmt(e.amount)} ${e.u}${e.b ? " · " + esc(e.b) : ""}</div></div><span class="e-k">${fmt(e.k)}</span></button>`).join("")}
      <button class="meal-add" data-add="${mi}">${ICON.plus} Hinzufügen</button>
    </section>`;
  };

  const waterGoal = App.settings.waterGoal || pl.water;
  const glass = App.settings.glass || 250;
  const nGlasses = Math.max(4, Math.ceil(waterGoal / glass));
  const filled = Math.floor((d.water || 0) / glass);

  const showBurn = pl.goal === "lose" || over;
  if (!burnUser || burnTarget == null) burnTarget = over ? Math.min(600, Math.ceil(-left / 10) * 10) : 100;
  const kg = latestWeight();

  v.innerHTML = `${topbar(`<button class="icon-btn" data-scan aria-label="Barcode scannen">${ICON.barcode}</button>`)}
  <div class="view">
    <div class="datebar">
      <button class="icon-btn" data-day="-1" aria-label="Vorheriger Tag">${ICON.left}</button>
      <div class="d grow">${dlabel(k)}${!isToday ? `<div class="xs faint" style="font-family:var(--f-body);font-weight:500">${dparse(k).toLocaleDateString("de-DE")}</div>` : ""}</div>
      <button class="icon-btn" data-day="1" aria-label="Nächster Tag">${ICON.right}</button>
    </div>

    <section class="card stack s16">
      <div class="hero">
        <div class="ring">${ringSVG(frac, over)}<div class="center"><span class="big">${fmt(Math.abs(left))}</span><span class="sub">${over ? "kcal zu viel" : "kcal übrig"}</span></div></div>
        <div class="hero-stats">
          <div class="kv"><span class="k">Ziel</span><span class="v">${fmt(pl.target)}</span></div>
          ${B.credit ? `<div class="kv"><span class="k">+ Aktivität (${Math.round(App.settings.credit * 100)} %)</span><span class="v">${fmt(B.credit)}</span></div>` : ""}
          <div class="kv"><span class="k">Gegessen</span><span class="v">${fmt(B.eaten)}</span></div>
          <div class="kv"><span class="k">Verbrauch (geschätzt)</span><span class="v">${fmt(B.burned)}</span></div>
          <div class="kv" style="padding-top:8px;border-top:1px solid var(--line)"><span class="k">${isPast ? "Bilanz" : "Bilanz bisher"}</span><span class="v" style="color:${!d.entries.length ? "var(--fg2)" : bal < 0 ? "var(--good)" : "var(--bad)"}">${d.entries.length ? fmtSigned(bal) : "–"}</span></div>
        </div>
      </div>
      <div class="macros">
        ${macroBar("Eiweiß", t.p, pl.protein, "var(--pro)")}
        ${macroBar("Kohlenh.", t.h, pl.carbs, "var(--carb)")}
        ${macroBar("Fett", t.f, pl.fat, "var(--fat)")}
      </div>
      <div class="row wrap small muted"><span>Ballaststoffe <b class="num" style="color:var(--fg)">${fmt(t.bs)}</b>/${pl.fiber} g</span><span>·</span><span>Zucker <b class="num" style="color:${t.z > pl.sugarMax * 1.5 ? "var(--warn)" : "var(--fg)"}">${fmt(t.z)}</b> g</span></div>
      <div class="statusline" style="color:${stColor}">${ICON[st.ic]}<span style="color:var(--fg)">${st.t}</span></div>
    </section>

    ${[0, 1, 2, 3].map(mealCard).join("")}

    <section class="card stack">
      <div class="row between"><h3>Wasser</h3><span class="num muted small"><b style="color:var(--fg)">${fmt((d.water || 0) / 1000, 2)}</b> / ${fmt(waterGoal / 1000, 1)} l</span></div>
      <div class="water">${Array.from({ length: nGlasses }, (_, i) => `<button class="${i < filled ? "f" : ""}" data-water="${i}" aria-label="${(i + 1) * glass} ml"></button>`).join("")}<button class="plus" data-water-plus aria-label="Glas hinzufügen">${ICON.plus}</button></div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Zusätzliche Aktivität</h3><button class="btn sm" data-addact>${ICON.plus} Eintragen</button></div>
      ${(d.acts || []).length ? `<div class="stack s4">${d.acts.map((a) => `<div class="list-row"><div class="act-ic">${ICON[a.ic || "run"]}</div><div class="grow"><b>${esc(a.label)}</b><div class="xs faint num">${a.detail || ""}</div></div><b class="num">+${fmt(a.kcal)}</b><button class="icon-btn plain" data-rmact="${a.id}" aria-label="Entfernen">${ICON.trash}</button></div>`).join("")}</div>` : `<p class="small muted">Sport oder Spaziergänge, die nicht in deinem Wochenplan stehen. ${Math.round(App.settings.credit * 100)} % davon werden deinem Budget gutgeschrieben.</p>`}
    </section>

    ${showBurn ? `<section class="card">
      <div class="card-h"><div><h3>Bonus-Burner</h3><p class="xs faint">So verbrennst du zusätzlich – berechnet für ${fmt(kg, 1)} kg</p></div></div>
      <div class="chips scroll" style="margin-bottom:6px">${[...new Set([...(over ? [Math.min(600, Math.ceil(-left / 10) * 10)] : []), 50, 100, 150, 200, 300])].map((x) => `<button class="chip ${burnTarget === x ? "on" : ""}" data-burn="${x}">${over && x === Math.min(600, Math.ceil(-left / 10) * 10) ? "Überschuss " : ""}${x} kcal</button>`).join("")}</div>
      <div class="burn-list">${EXERCISES.filter((ex) => burnAll || ["pushup", "squat", "burpee", "jack", "walk", "jog"].includes(ex.id)).map((ex) => {

        const main = ex.kind === "reps" ? `${r.sets} × ${r.reps} Wdh.` : `${r.min} Min.`;
